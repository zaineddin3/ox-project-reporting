<style>
/* Layout: a dark switchboard-style rail lists the report sections (the workbook's tabs); the work surface scrolls beside it. Under 860px the rail becomes a sticky scrolling tab strip. */
:root{
  --bg:#f1f2ef; --surface:#ffffff; --ink:#1a232d; --muted:#5b6672; --line:#d8dcd6; --soft:#e9ebe6;
  --accent:#b0541c; --accent-soft:#f5e3d6; --accent-ink:#ffffff;
  --rail:#1c2732; --rail-ink:#c9d2db; --rail-hi:#ffffff;
  --series2:#386a96; --good:#2b7a4b; --good-soft:#dcefe3; --warn:#9a6a08; --warn-soft:#f6ebcf; --bad:#b0352a; --bad-soft:#f6dcd8;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#171f28; --ink:#e3e8ed; --muted:#95a1ae; --line:#2a3541; --soft:#1e2832;
  --accent:#e2884d; --accent-soft:#3a2618; --accent-ink:#1a1008;
  --rail:#0b1015; --rail-ink:#aeb9c4; --rail-hi:#ffffff;
  --series2:#7eb0dc; --good:#5cc088; --good-soft:#163024; --warn:#e2b44c; --warn-soft:#33290f; --bad:#ef6f62; --bad-soft:#3a1916;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#171f28; --ink:#e3e8ed; --muted:#95a1ae; --line:#2a3541; --soft:#1e2832;
  --accent:#e2884d; --accent-soft:#3a2618; --accent-ink:#1a1008;
  --rail:#0b1015; --rail-ink:#aeb9c4; --rail-hi:#ffffff;
  --series2:#7eb0dc; --good:#5cc088; --good-soft:#163024; --warn:#e2b44c; --warn-soft:#33290f; --bad:#ef6f62; --bad-soft:#3a1916;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center}
.brand .mark{width:38px;height:38px;border:2px solid var(--accent);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--rail-hi);letter-spacing:.04em}
.brand .t{font-family:var(--f-display);font-weight:600;color:var(--rail-hi);font-size:17px;line-height:1.1}
.brand .s{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px}
.nav button .n{font-family:var(--f-mono);font-size:11px;opacity:.55;width:18px}
.nav button:hover{background:color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav button[aria-current="true"] .n{opacity:.8}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ptree{display:flex;flex-direction:column;gap:4px}
.plabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:0 10px 2px}
.pgroup{display:flex;flex-direction:column;gap:2px}
.pgroup.open{background:color-mix(in srgb,var(--rail-ink) 6%,transparent);border-radius:8px;padding:2px 0 6px}
.proj{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--rail-hi)}
.proj .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .caret{width:12px;font-size:11px;opacity:.7}
.proj:hover{background:color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.proj:focus-visible,.addproj:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pgroup .nav{padding-left:12px}
.addproj{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--accent);font-weight:600}
.addproj:hover{background:color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.projsel{display:none}
.pgroup.shut .nav{display:none}
.pcaret{all:unset;cursor:pointer;width:22px;height:30px;display:grid;place-items:center;color:var(--rail-ink);font-size:11px;border-radius:5px;flex:0 0 22px}
.pcaret:hover{background:color-mix(in srgb,var(--rail-ink) 12%,transparent)}
.pcaret:focus-visible{outline:2px solid var(--accent)}
.proj.cur .pn{color:var(--rail-hi)}
.pgroup:not(.active) .proj{font-weight:500;opacity:.85}
.pgroup.open:not(.active){background:color-mix(in srgb,var(--rail-ink) 3%,transparent)}
.prow{display:flex;align-items:center;gap:2px;min-width:0}
.prow .proj{flex:1;min-width:0}
.pacts{display:none}
.prow:hover .pacts,.prow:focus-within .pacts,.pgroup.open .pacts{display:flex}
.pact{all:unset;cursor:pointer;padding:5px 7px;border-radius:5px;font-size:12px;color:var(--rail-ink);opacity:.8}
.pact:hover{background:color-mix(in srgb,var(--rail-ink) 14%,transparent);opacity:1}
.pact:focus-visible{outline:2px solid var(--accent)}
.pact.danger{background:var(--bad);color:#fff;opacity:1;font-weight:600}
.prow.confirm{padding:6px 8px;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--rail-hi)}
.prow.confirm .pn{flex-basis:100%}
.prename{flex:1;min-width:0;background:var(--rail);color:var(--rail-hi);border:1px solid var(--accent);border-radius:5px;padding:6px 8px;font:600 15px var(--f-display)}
.prename:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.rail .foot{margin-top:auto;font-size:11.5px;opacity:.7;line-height:1.4}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,min(4vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px),min(4vw,40px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.top .meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:13px;margin-top:6px}
.top .meta b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.busy{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;line-height:1.15}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;line-height:1.2}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px;margin-bottom:12px}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.stack{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel > h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.mono{font-family:var(--f-mono);font-size:12.5px}
tfoot td{font-weight:600;background:var(--soft);border-top:1px solid var(--line);border-bottom:0}
.money{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.ledger td{padding:6px 0;border-bottom:1px dashed var(--line)}
.ledger td:last-child{text-align:right}
.ledger tr.total td{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:600;padding-top:8px}
.ledger tr.sub td{color:var(--muted);font-size:13px}
input.f,select.f,textarea.f{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:5px;padding:5px 7px}
input.f:hover,select.f:hover,textarea.f:hover{border-color:var(--line)}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
input.f.num{text-align:right;font-family:var(--f-mono);font-size:12.5px}
input.f::placeholder,textarea.f::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.form label .f{border-color:var(--line);text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400;background:var(--surface)}
.form label.wide{grid-column:1/-1}
textarea.f{resize:vertical;min-height:84px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;font-weight:600;margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.b2 > i{background:var(--series2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)}
.cur{position:relative}
.cur::before{content:"$";position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-mono);font-size:12.5px;pointer-events:none}
.cur input.f{padding-left:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
tr.subtot td{background:var(--soft);font-weight:600;border-bottom:2px solid var(--line)}
tr.grand td{background:var(--ink);color:var(--surface);font-weight:600}
tr.grand td.neg{color:var(--bad-soft)}
.form input.f:disabled{opacity:.7}
.addrow td{padding:6px 8px;border-bottom:2px solid var(--line)}
.secrow td{background:var(--soft);padding:6px 8px}
.secrow input.f{font-family:var(--f-display);font-weight:600;font-size:15px}
.itp{display:flex;align-items:center;gap:2px;white-space:nowrap}
.itp-file{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;background:var(--good-soft);color:var(--good);font-weight:600;font-size:12px;text-decoration:none}
.itp-file::before{content:"";width:9px;height:11px;border:1.5px solid currentColor;border-radius:1px}
.itp-file:hover{text-decoration:underline}
.itp-act{padding:3px 6px;font-size:12px}
.itp-up{padding:4px 10px;font-size:12px;white-space:nowrap;cursor:pointer}
.cur.strong input.f{font-weight:700}
.pcbar{display:flex;flex-direction:column;gap:3px}
.bar.thin{height:4px}
.pcbar-l{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:11.5px;margin-top:3px}
.tog{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:20px;height:20px;margin-right:4px;border-radius:4px;color:var(--ink);font-size:12px}
.tog:hover{background:var(--soft)}
.tog:focus-visible{outline:2px solid var(--accent)}
.subtask{display:flex;gap:6px;align-items:center}
.subtask select.f{width:150px;flex:0 0 150px}
.subtask input.f{flex:1;min-width:120px}
tr.subrow select.f[data-b$='|pct']{width:110px}
.splitbtn{padding:3px 8px;font-size:12px;color:var(--accent);opacity:.75;white-space:nowrap}
tr:hover .splitbtn{opacity:1}
tr.parentrow td{border-bottom-style:dashed}
tr.subrow input.f.num{min-width:72px}
tr.subrow input.f:not(.num){min-width:60px}
tr.subrow td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
tr.subrow td:nth-child(2){padding-left:18px}
tr.subadd td{padding:2px 8px 6px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.bupanel{padding:16px 18px 20px;background:var(--surface);border-top:2px solid var(--accent);display:flex;flex-direction:column;gap:6px}
.form.rates{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.bu-sum td{padding:6px 8px}
.bu-sum td:nth-child(2),.bu-sum td:nth-child(3){text-align:right;width:130px}
.tender{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px 16px;align-items:end}
.tender label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tender label .f{border-color:var(--line);font-size:14px;color:var(--ink);background:var(--surface)}
.hcmp-wrap{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.hcmp{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 110px;gap:12px;align-items:center}
.hcmp-l{display:flex;flex-direction:column;font-size:13px;line-height:1.25}
.hcmp-t{position:relative;height:16px;background:var(--soft);border-radius:4px}
.hcmp-b{height:100%;border-radius:4px}
.hcmp-b.t{background:var(--muted);opacity:.55}
.hcmp-b.a{background:var(--accent)}
.hcmp-b.f{background:var(--series2)}
.hcmp-tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.hcmp-v{text-align:right;font-size:13px}
@media (max-width:640px){.hcmp{grid-template-columns:minmax(0,1fr) 90px}.hcmp-t{grid-column:1/-1;grid-row:2}}
.login{position:fixed;inset:0;z-index:100;background:var(--rail);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login-card{background:var(--surface);color:var(--ink);border-radius:12px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.login-card .brand .t{color:var(--ink)}.login-card .brand .s{color:var(--muted);opacity:1}
.login-card h2{margin-top:10px}
.login-card label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.login-card input.f{border-color:var(--line);font-size:15px;padding:9px 10px}
.login-card .btn{justify-content:center;padding:10px}
.who{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;color:var(--rail-hi);word-break:break-all}
.who .addproj{padding:4px 0;font-size:12px}
.ro{background:color-mix(in srgb,var(--soft) 55%,transparent);color:var(--muted);cursor:not-allowed}
.splitsum{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:5px;font-size:12px}
.schip{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.schip b{font-family:var(--f-body);font-weight:600;color:var(--ink)}
.schip.part{background:var(--warn-soft);color:var(--warn)}.schip.done{background:var(--good-soft);color:var(--good)}
tr.pg-empty td{color:var(--muted)}
.pg-task{padding:12px 16px}
.pg-head{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.pg-head:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.pg-head .caret{width:14px;color:var(--muted)}
.pg-name{font-family:var(--f-display);font-weight:600;font-size:17px;flex:1;min-width:200px}
.pg-sum{display:flex;align-items:center;gap:14px;min-width:260px}
.pg-sum .pg-bar{width:180px}
.pg-bar{display:flex;align-items:center;gap:8px;min-width:120px}.pg-bar .bar{flex:1}.pg-bar .money{width:40px;text-align:right;font-size:12.5px}
.pg-in{display:flex;align-items:center;gap:6px}.pg-in input.f{width:80px;flex:0 0 80px;border-color:var(--line)}.pg-in .pg-bar{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px}
.chip:hover{border-color:var(--muted)}

const pending={}, inflight={}, latest={}, latestAt={}, flushAt={}, deleted=new Set(), exists=new Set();

const isDirty=p=>!!pending[p]||!!inflight[p];
function setSave(state,msg){
  const el=document.getElementById('savepill');
  el.className='pill '+({saving:'busy',saved:'ok',error:'err',local:''}[state]||'');
  el.textContent={saving:'Saving…',saved:'All changes saved',error:msg||'Save failed',local:'Not saving'}[state]||state;
}
function dataFor(p){
  const [c,id]=p.split('/');
  if(c==='projects')return PROJ[id];
  if(c==='project'){if(id==='labourlog')return S.llog;if(id==='claim')return claimDoc();if(id==='info')return S.info;if(id==='cashflow')return S.cash;if(id==='crew')return {rows:crewRows()}}
  if(c==='variations')return S.vars[id];if(c==='orders')return S.orders[id];if(c==='procurement')return S.procs[id];
  if(c==='tasks')return taskDoc(id);
}
function persist(p){
  if(!db){setSave('local');return}
  setSave('saving');clearTimeout(pending[p]);
  pending[p]=setTimeout(()=>flush(p),650);
}
async function flush(p){
  delete pending[p];inflight[p]=(inflight[p]||0)+1;flushAt[p]=Date.now();
  try{
    if(p.startsWith('apartments/')){
      const t=p.split('/')[1];const d=aptDoc(t);const Q=aptQueue[t]||new Set();const units={};
      for(const u of Q)units[u]=unitState(t,u);Q.clear();
      const body={name:d.name,created:d.created,removed:d.removed,stages:d.stages,itps:d.itps,units};if(structDirty.has(t)){body.sections=d.sections;structDirty.delete(t)}
      if(exists.has(p))await db.doc(phys(p)).update(body);else{await db.doc(phys(p)).set(clone(d));exists.add(p)}
    }else{
      const data=dataFor(p);if(data)await db.doc(phys(p)).set(clone(data));exists.add(p);
    }
  }catch(e){
    console.error(e);
    if(e&&e.code==='invalid_argument'&&p.startsWith('apartments/')){exists.delete(p)}
    setSave('error',e&&e.code==='quota_exceeded'?'Storage full':e&&e.code==='invalid_argument'?'You can view but not edit':'Save failed — retrying on next edit');
    inflight[p]--;return;
  }
  inflight[p]--;
  if(!isDirty(p)&&latest[p]&&latestAt[p]>flushAt[p]&&!p.startsWith('variations/')&&!p.startsWith('orders/')&&!p.startsWith('procurement/'))applyDoc(p,latest[p]);
  if(!Object.keys(pending).length&&!Object.values(inflight).some(Boolean))setSave('saved');
  scheduleRender();
}
async function removeDoc(p){
  deleted.add(p);clearTimeout(pending[p]);delete pending[p];
  if(!db)return;
  try{await db.doc(phys(p)).delete()}catch(e){setSave('error','Delete failed')}
}
function applyDoc(p,data){
  const [c,id]=p.split('/');const d=clone(data);
  if(c==='project'){if(id==='labourlog')S.llog={rows:Array.isArray(d.rows)?d.rows:[]};else if(id==='claim')S.claim=normClaim(d);else if(id==='info')S.info=d;else if(id==='cashflow')S.cash={start:d.start||'',m:d.m||{}};else if(id==='crew')S.crew={rows:d.rows||null}}
  else if(c==='apartments'){S.apt[id]=normTrade(id,d)}
  else if(c==='tasks'){S.tasks[id]={items:d.items||[],sections:d.sections||[]}}
}
function onColl(name,snap){
  const mapKey={variations:'vars',orders:'orders',procurement:'procs'}[name];
  const seen=new Set();
  const next={};
  for(const d of snap.docs){
    const p=name+'/'+d.id;seen.add(p);exists.add(p);latest[p]=d.data();latestAt[p]=Date.now();
    if(deleted.has(p))continue;
    if(mapKey){next[d.id]=isDirty(p)&&S[mapKey][d.id]?S[mapKey][d.id]:clone(d.data())}
    else if(!isDirty(p))applyDoc(p,d.data());
  }
  for(const p of [...deleted])if(p.startsWith(name+'/')&&!seen.has(p))deleted.delete(p);
  if(mapKey){
    for(const id in S[mapKey]){const p=name+'/'+id;if(!(id in next)&&isDirty(p))next[id]=S[mapKey][id]}
    S[mapKey]=next;
  }
  scheduleRender();
}

/* ---------- calculations ---------- */
function crewRate(){
  let c=0,h=0;for(const r of crewRows()){c+=num(r.qty)*num(r.rate)*num(r.hrs);h+=num(r.qty)*num(r.hrs)}
  return h?c/h:0;
}
function logTotals(){let h=0,o=0,c=0;for(const r of S.llog.rows){h+=num(r.hire);o+=num(r.ox);c+=num(r.cost)}return {hire:h,ox:o,hrs:h+o,cost:c,rate:(h+o)?c/(h+o):0}}
function labourRateSrc(){if(num(S.info.labourRate))return 'Override set in project details';if(logTotals().rate)return 'Average from labour cost log';if(num(S.info.tenderRate))return 'Tendered rate (no labour cost log entries yet)';return 'Blended crew rate (add rows to the labour cost log to use actual costs)'}
function labourRate(){return num(S.info.labourRate)||logTotals().rate||num(S.info.tenderRate)||crewRate()}
function taskCalc(t){
  let est=0,spent=0,earned=0,fc=0;
  for(const it of taskDoc(t).items){const x=itemCalc(it);est+=x.est;spent+=x.spent;earned+=x.earned;fc+=x.fc}
  return {est,spent,earned,fc,varHrs:est-fc,pct:est?earned/est:0};
}
function itemOne(it){
  const e=num(it.estHrs),s=num(it.spentHrs),p=Math.min(Math.max(num(it.pct),0),100)/100,q=num(it.qty);
  const ftc=p>0?s*(1-p)/p:e;
  return {est:e,spent:s,qty:q,pct:p,installed:q*p,earned:e*p,ftc,fc:s+ftc,varHrs:e-(s+ftc),rateEst:q?e/q:0,rateAct:q*p?s/(q*p):0};
}
function itemCalc(it){
  if(!(it.subs&&it.subs.length))return itemOne(it);
  const t={est:0,spent:0,qty:0,installed:0,earned:0,ftc:0,fc:0};
  for(const sb of it.subs){const x=itemOne(sb);for(const k in t)t[k]+=x[k]}
  t.pct=t.est?t.earned/t.est:0;t.varHrs=t.est-t.fc;t.rateEst=t.qty?t.est/t.qty:0;t.rateAct=t.installed?t.spent/t.installed:0;t.split=true;return t;
}
function subRate(d,sb){const sg=d.stages.find(z=>z.id===sb.task);return sb.rate!==''&&sb.rate!=null?num(sb.rate):(sg?num(sg.rate):0)}
function subCalc(d,sb){const v=subRate(d,sb)*lineQty(sb);const p=Math.min(Math.max(num(sb.pct),0),100)/100;return {v,p,c:v*p}}
function aptCalc(t){
  const d=aptDoc(t);const rates=d.stages.map(s=>num(s.rate));const per=rates.reduce((a,x)=>a+x,0);const n=d.stages.length;
  const share=i=>per?rates[i]/per:(n?1/n:0);
  const stage=d.stages.map((s,i)=>({id:s.id,name:s.name,price:rates[i],total:0,claimed:0,done:0}));
  const itp={};d.itps.forEach(x=>itp[x.id]=0);let claimed=0,full=0,total=0,count=0;const secs={};
  for(const sec of d.sections){const sc=secs[sec.id]={total:0,claimed:0,count:sec.lines.length};
    for(const l of sec.lines){count++;const st=d.units[l.id]||{};let uc=0,v=0,all;
      if(l.subs&&l.subs.length){all=true;for(const sb of l.subs){const x=subCalc(d,sb);v+=x.v;uc+=x.c;const sg=stage.find(z=>z.id===sb.task);if(sg){sg.total+=x.v;sg.claimed+=x.c;if(x.p>=1)sg.done++}if(x.p<1)all=false}total+=v;sc.total+=v}
      else{v=(num(l.rate)||per)*lineQty(l);total+=v;sc.total+=v;all=n>0;
      stage.forEach((s,i)=>{const p=num(st.s?.[s.id]);const sv=v*share(i);s.total+=sv;s.claimed+=sv*p/100;uc+=sv*p/100;if(p>=100)s.done++;else all=false})}
      claimed+=uc;sc.claimed+=uc;if(all)full++;for(const k in itp)if(st.itp?.[k])itp[k]++}}
  return {id:t,name:d.name,count,per,total,claimed,stage,itp,full,secs,pct:total?claimed/total:0};
}
function calc(){
  const contract=(S.info.contract!==undefined&&S.info.contract!=='')?num(S.info.contract):claimTotals().c.sum,pcSum=num(S.info.pcSum);
  let vApp=0,vUn=0,vRej=0,vProfit=0;const vCount={};
  for(const v of Object.values(S.vars)){
    const VN=vNums(v);const sub=VN.sell;const st=v.status||'Submitted';vCount[st]=(vCount[st]||0)+1;
    if(st==='Approved'){vApp+=sub;vProfit+=VN.margin}
    else if(st==='Rejected'||st==='Withdrawn')vRej+=sub;else vUn+=sub;
  }
  const revised=contract+vApp;
  let poTotal=0,matInv=0,matAnt=0,matFc=0,ret=0,leftPO=0;
  for(const o of Object.values(S.orders)){
    const po=num(o.po),inv=(o.inv||[]).reduce((a,x)=>a+num(x.amount),0),ant=num(o.anticipated);
    poTotal+=po;leftPO+=Math.max(po-inv,0);matInv+=inv;matAnt+=ant;matFc+=Math.max(po,inv)+ant;if(o.retention)ret+=inv*0.05;
  }
  const rate=labourRate();
  let lEst=0,lSpent=0,lFc=0,lEarned=0;
  for(const t of TASK_IDS){const c=taskCalc(t);lEst+=c.est;lSpent+=c.spent;lFc+=c.fc;lEarned+=c.earned}
  const otherHrs=num(S.info.otherHrs);lSpent+=otherHrs;lFc+=otherHrs;
  const labAct=lSpent*rate,labFc=lFc*rate;
  const other=num(S.info.otherCost);
  const fcCost=matFc+labFc+other;
  const CT=claimTotals();const hasHistCost=claimDoc().hist.some(h=>h.cost!==''&&h.cost!=null);const costCalc=matInv+labAct+num(S.info.otherCostToDate);const costToDate=hasHistCost?CT.cost:costCalc;
  const invoiced=CT.ha,retention=CT.ret;
  const gp=revised-fcCost;const TR=tradeIds().map(aptCalc);const subTotal=TR.reduce((a,x)=>a+x.total,0),subClaimed=TR.reduce((a,x)=>a+x.claimed,0);
  return {contract,pcSum,vApp,vUn,vRej,vProfit,vCount,revised,poTotal,matInv,matAnt,matFc,ret,rate,lEst,lSpent,lFc,lEarned,labAct,labFc,other,fcCost,costToDate,
    invoiced,retention,gp,gpPct:revised?gp/revised:0,leftInvoice:revised-invoiced,leftSpend:Math.max(lFc-lSpent,0)*rate+leftPO+matAnt,labHrsToGo:Math.max(lFc-lSpent,0),leftPO,marginToDate:invoiced-costToDate,pctInv:revised?invoiced/revised:0,
    trades:TR,subTotal,subClaimed,pctCost:fcCost?costToDate/fcCost:0,pctHrs:lEst?lEarned/lEst:0,pctSub:subTotal?subClaimed/subTotal:0};
}
function months(){
  let st=S.cash.start;if(!/^\d{4}-\d{2}$/.test(st||'')){const d=new Date();st=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  let [y,m]=st.split('-').map(Number);const out=[];
  for(let i=0;i<30;i++){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}
  return out;
}
const monthLabel=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-AU',{month:'short',year:'2-digit'})};

function head(title,sub,actions=''){return `<div class="sec-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${actions}</div>`}

      ${(!proc.length&&!taskRows.some(x=>x.c.varHrs<0)&&c.gp>=0)?'<p class="hint" style="margin:0">Nothing flagged. Late orders, tasks forecasting over their hours, and a negative margin show here.</p>':''}

function tradeBars(c){
  if(!c.trades.length)return '<p class="hint" style="margin:0">No subcontractor trades set up.</p>';
  return c.trades.map((a,i)=>`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${esc(a.name||'Untitled trade')}</b><span class="money">${money(a.claimed)} / ${money(a.total)}</span></div>
    <div class="bar${i%2?' b2':''}"><i style="width:${(a.pct*100).toFixed(1)}%"></i></div>
    <div class="hint">${pct(a.pct)} claimed · ${a.full} of ${a.count} lines fully complete</div></div>`).join('');
}
function tenderPanel(c){
  const th=num(S.info.tenderHrs),tr=num(S.info.tenderRate);const tv=th*tr;
  const LT=logTotals();const act=LT.hrs||c.lSpent;const actSrc=LT.hrs?'from labour cost log':'from hours spent in tasks';
  const fc=Math.max(c.lFc,act);
  const max=Math.max(th,act,fc,1);
  const bar=(lbl,v,cls,sub)=>`<div class="hcmp"><div class="hcmp-l"><b>${lbl}</b><span class="hint">${sub}</span></div><div class="hcmp-t"><div class="hcmp-b ${cls}" style="width:${(v/max*100).toFixed(1)}%"></div>${th?`<div class="hcmp-tick" style="left:${(th/max*100).toFixed(1)}%"></div>`:''}</div><div class="hcmp-v money">${hrs(v)} hrs</div></div>`;
  const chip=(v,label)=>{if(!th)return `<span class="tag">Enter tendered hours</span>`;const d=v-th;const p=d/th;return `<span class="tag ${d>0?'bad':'good'}">${d>0?hrs(d)+' hrs over':hrs(-d)+' hrs under'} ${label} (${d>0?'+':''}${pct(p,1)})</span>`};

    <div class="mini"><span class="l">Forecast hours</span><span class="v ${th&&fc>th?'neg':''}">${hrs(fc)}</span><span class="hint ${th&&fc>th?'neg':''}">${th?(fc>th?hrs(fc-th)+' hrs over tender':hrs(th-fc)+' hrs under tender'):'Enter tendered hours to compare'}</span></div>
    <div class="mini"><span class="l">Rate used for forecast</span><span class="v">$${c.rate.toFixed(2)}/hr</span><span class="hint">${labourRateSrc().split(' (')[0]}</span></div>
  </div>
  <div class="hcmp-wrap">
    ${bar('Tendered',th,'t','Allowed in the tender')}
    ${bar('Actual to date',act,'a',actSrc)}
    ${bar('Forecast at completion',fc,'f','actual + hours to go')}
  </div>
  <div class="toolbar" style="margin-top:12px">
    <span class="hint">Actual vs tender:</span>${th?`<span class="tag ${used>1?'bad':used>.9?'warn':'acc'}">${pct(used,0)} of tendered hours used</span>`:''}
    <span class="hint" style="margin-left:10px">Forecast vs tender:</span>${chip(fc,'estimate')}
    ${th&&tr?`<span class="hint" style="margin-left:10px">Cost impact at forecast rate:</span><span class="tag ${fc*c.rate>tv?'bad':'good'}">${money(fc*c.rate-tv)}</span>`:''}
  </div></div>`;
}
function completionMeasures(c){return [['cost','Cost incurred vs forecast final cost',c.fcCost,c.pctCost,`${money(c.costToDate)} of ${money(c.fcCost)}`],
    ['inv','Invoiced vs revised contract',c.revised,c.pctInv,`${money(c.invoiced)} of ${money(c.revised)}`],

}
function ledger(c){
  const r=(l,v,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="money ${v<0?'neg':''}">${money(v)}</td></tr>`;
  return `<table class="ledger"><tbody>

function cashChart(){
  const ms=months();let cs=0,cc=0;const pts=ms.map(k=>{const r=S.cash.m[k]||{};cs+=num(r.sales);cc+=num(r.cost);return {k,cs,cc}});
  const max=Math.max(1,...pts.map(p=>Math.max(p.cs,p.cc)));
  if(!pts.some(p=>p.cs||p.cc))return `<div class="empty"><b>No forecast entered yet</b>Add monthly claim and cost forecasts under Cash flow to see cumulative sales against cost.</div>`;
  const W=900,H=260,L=64,R=14,T=12,B=30,iw=W-L-R,ih=H-T-B;
  const nice=(()=>{const step=Math.pow(10,Math.floor(Math.log10(max)));const m=[1,2,2.5,5,10].find(x=>x*step*4>=max)*step;return m})();
  const top=nice*4;const x=i=>L+iw*i/(pts.length-1),y=v=>T+ih*(1-v/top);
  let grid='';for(let i=0;i<=4;i++){const v=nice*i;grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${kmoney(v)}</text>`}
  let xl='';pts.forEach((p,i)=>{if(i%3===0)xl+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${monthLabel(p.k)}</text>`});
  const line=key=>pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join('');
  const area=`${line('cs')}L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative forecast sales and costs by month">${grid}${xl}
    <path d="${area}" fill="var(--accent)" fill-opacity=".08"/>
    <path d="${line('cs')}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
    <path d="${line('cc')}" fill="none" stroke="var(--series2)" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last.cs)}" r="4" fill="var(--accent)"/><circle cx="${x(pts.length-1)}" cy="${y(last.cc)}" r="4" fill="var(--series2)"/>
  </svg><div class="legend"><span><i style="background:var(--accent)"></i>Cumulative claims ${money(last.cs)}</span><span><i style="background:var(--series2)"></i>Cumulative costs ${money(last.cc)}</span><span>Net position ${money(last.cs-last.cc)}</span></div>`;
}

const VBU_DEF=()=>({hcv:'',refTxt:'',longDesc:'',rates:{cl:'65',cs:'65',cp:'65',sl:'135',ss:'185',sp:'185'},mark:'10',
  lines:[{id:uid('x'),item:'',qty:'',mat:'',per:'',hrs:'',kind:'L',comments:''},{id:uid('x'),item:'Supervision',qty:'',mat:'',per:'',hrs:'',kind:'S',comments:''},{id:uid('x'),item:'Project Management',qty:'',mat:'',per:'',hrs:'',kind:'P',comments:''}]});
const kindOf=l=>(l.kind==='S'&&/project\s*manag/i.test(l.item||''))?'P':(l.kind||'L');
const rateOf=(r,k)=>{const v=r[k];return v===undefined||v===''?(k==='cp'?(r.cs??'65'):k==='sp'?(r.ss??'185'):v):v};
function vbuCalc(bu){
  const r=bu.rates||{};let mat=0,lh=0,sh=0,ph=0;
  for(const l of bu.lines||[]){const q=num(l.qty);mat+=q*num(l.mat);const k=kindOf(l);if(k==='S')sh+=q*num(l.hrs);else if(k==='P')ph+=q*num(l.hrs);else lh+=q*num(l.hrs)}
  const mark=mat*num(bu.mark)/100;
  const cost={mat,extra:0,lab:lh*num(r.cl),sup:sh*num(r.cs),pm:ph*num(rateOf(r,'cp'))};cost.total=cost.mat+cost.lab+cost.sup+cost.pm;
  const sell={mat,extra:mark,lab:lh*num(r.sl),sup:sh*num(r.ss),pm:ph*num(rateOf(r,'sp'))};sell.total=sell.mat+sell.extra+sell.lab+sell.sup+sell.pm;
  return {mat,lh,sh,ph,hrs:lh+sh+ph,cost,sell,margin:sell.total-cost.total,matCost:mat,labCost:cost.lab+cost.sup+cost.pm};
}
const hasBu=v=>!!(v&&v.bu&&v.bu.lines&&v.bu.lines.some(l=>num(l.qty)&&(num(l.mat)||num(l.hrs))));
function syncClaimVar(id){
  const d=claimDoc();const v=S.vars[id];
  const take=L=>{const i=L.findIndex(l=>l.vid===id);return i>=0?L.splice(i,1)[0]:null};
  const old=take(d.av)||take(d.pv);
  let changed=!!old;
  if(v){const st=v.status||'Submitted';
    if(st==='Approved'||st==='Submitted'){
      const base=old||{...newPcLine(),vid:id};
      Object.assign(base,{ref:v.ref||base.ref||'',desc:v.desc||base.desc||'',sum:String(Math.round(vNums(v).sell*100)/100)});
      if(st==='Approved'){base.aref=v.approvalRef||base.aref||'';d.av.push(base)}
      else{base.status=base.status&&base.status!=='Draft'?base.status:'Submitted';base.sub=base.sub||v.date||'';d.pv.push(base)}
      changed=true;
    }else if(st==='Draft'&&old){d.pv.push(old)}
  }
  if(changed)persist('project/claim');
}
function vNums(v){if(hasBu(v)){const x=vbuCalc(v.bu);return {sell:x.sell.total,cost:x.cost.total,mat:x.matCost,lab:x.labCost,hrs:x.hrs,margin:x.margin,bu:true}}
  const sell=num(v.submitted),mat=num(v.nonLabour),lab=num(v.labour);return {sell,cost:mat+lab,mat,lab,hrs:num(v.hours),margin:sell-mat-lab,bu:false}}
function delBtn(kind,id,extra='',label=''){const a=UI.armed===kind+id+extra;return `<button class="btn ${a?'armed':'ghost'}" data-act="del" data-kind="${kind}" data-id="${id}" data-x="${extra}" aria-label="${label||'Delete'}" style="white-space:nowrap">${a?'Confirm':(label||'✕')}</button>`}

V.procurement=()=>{
  const rows=Object.entries(S.procs).sort((a,b)=>(a[1].created||0)-(b[1].created||0));
  const today=todayISO();
  let save=0;rows.forEach(([,p])=>{if(num(p.po))save+=num(p.tender)-num(p.po)});
  return `<div class="stack">${head('Procurement schedule','Latest order date is worked back from the date required on site and the total lead time.','<button class="btn primary" data-act="add-proc">+ Add item</button>')}
  <div class="statgrid"><div class="mini"><span class="l">Items</span><span class="v">${rows.length}</span></div><div class="mini"><span class="l">Savings / losses vs tender</span><span class="v ${save<0?'neg':''}">${money(save)}</span></div></div>
  ${rows.length?`<div class="tw"><table style="min-width:1400px"><thead><tr><th style="min-width:190px">Item</th><th>Status</th><th class="n">Tender / budget</th><th class="n">PO value</th><th class="n">Saving</th><th>Supplier</th><th>PO no.</th><th>Approval</th><th class="n">Lead time (wks)</th><th>Required on site</th><th>Order by</th><th>Ordered</th><th>Est. delivery</th><th>Delivery</th><th style="min-width:150px">Comments</th><th></th></tr></thead><tbody>
  ${rows.map(([id,p])=>{const k='proc|'+id+'|';const sv=num(p.po)?num(p.tender)-num(p.po):0;
    const by=p.required?addDays(p.required,-7*num(p.lead)):'';const late=by&&!p.ordered&&by<today&&!['Complete','Delivered'].includes(p.status);

    return `<tr><td>${inp(k+'item',p.item,{label:'Item',ph:'e.g. Main switchboard'})}</td><td style="width:150px">${sel(k+'status',p.status||'Waiting for contract',PSTATUS,{label:'Status'})}</td>
    <td style="width:110px">${inp(k+'tender',p.tender,{num:1,label:'Tender price'})}</td><td style="width:110px">${inp(k+'po',p.po,{num:1,label:'PO value'})}</td><td class="n money ${sv<0?'neg':''}">${num(p.po)?money(sv):'—'}</td>
    <td style="width:130px">${inp(k+'supplier',p.supplier,{label:'Supplier'})}</td><td style="width:100px">${inp(k+'poNo',p.poNo,{label:'PO number'})}</td>
    <td style="width:130px">${sel(k+'approval',p.approval||'Not submitted',['Not submitted','Submitted','Approved','Rejected'],{label:'Approval'})}</td>
    <td style="width:80px">${inp(k+'lead',p.lead,{num:1,label:'Lead time weeks'})}</td><td style="width:140px">${inp(k+'required',p.required,{type:'date',label:'Required on site'})}</td>
    <td>${by?`<span class="tag ${late?'bad':p.ordered?'good':''}">${fmtDate(by)}</span>`:'<span class="hint">—</span>'}</td>
    <td style="width:140px">${inp(k+'ordered',p.ordered,{type:'date',label:'Order placed'})}</td><td style="width:140px">${inp(k+'eta',p.eta,{type:'date',label:'Estimated delivery'})}</td>
    <td>${dd===null?'<span class="hint">—</span>':`<span class="tag ${dd<0?'bad':'good'}">${dd<0?-dd+' days late':dd+' days spare'}</span>`}</td>
    <td>${inp(k+'comments',p.comments,{label:'Comments'})}</td><td>${delBtn('proc',id)}</td></tr>`}).join('')}
  </tbody></table></div>`:`<div class="panel empty"><b>No items scheduled</b>Add long-lead equipment (switchboards, generators, luminaires) to track approvals and order-by dates.</div>`}</div>`;
};

V.cashflow=()=>{

  ${ms.map(k=>{const r=S.cash.m[k]||{};cs+=num(r.sales);cc+=num(r.cost);return `<tr><td>${monthLabel(k)}</td><td style="width:150px">${inp('cash|'+k+'|sales',r.sales||'',{num:1,label:'Claims '+k,ph:'0'})}</td><td style="width:150px">${inp('cash|'+k+'|cost',r.cost||'',{num:1,label:'Costs '+k,ph:'0'})}</td><td class="n money">${money(cs)}</td><td class="n money">${money(cc)}</td><td class="n money ${cs-cc<0?'neg':''}">${money(cs-cc)}</td></tr>`}).join('')}

V.subcontractors=()=>{
  const ids=tradeIds();if(!ids.includes(UI.bld))UI.bld=ids[0]||'';
  const t=UI.bld;
  const chips=`<div class="chips" role="group" aria-label="Trade">${ids.map(x=>`<button class="chip" data-act="bld" data-v="${x}" aria-pressed="${t===x}">${esc(aptDoc(x).name||'Untitled trade')}</button>`).join('')}<button class="chip add" data-act="add-trade">+ Add trade</button></div>`;
  const hd=head('Subcontractors','Build each trade’s claim from your own sections and lines. A line with no rate uses the trade’s standard rate from its claim stages.',t?`<button class="btn" data-act="setup" aria-expanded="${UI.setup}">${UI.setup?'Close setup':'Edit trade setup'}</button>`:'');
  if(!t)return `<div class="stack">${hd}${chips}<div class="panel empty"><b>No trades yet</b>Add a trade to track a subcontractor's progress line by line.</div></div>`;
  const d=aptDoc(t),a=aptCalc(t);
  if(UI.level!=='all'&&!d.sections.some(x=>x.id===UI.level))UI.level='all';
  if(!d.stages.some(x=>x.id===UI.bulkStage))UI.bulkStage=d.stages[0]?.id||'';
  const q=UI.q.trim().toUpperCase();
  const shown=d.sections.map((x,si)=>({x,si})).filter(o=>UI.level==='all'||o.x.id===UI.level);
  const nLines=shown.reduce((n,o)=>n+o.x.lines.filter(l=>lineMatch(l,q)).length,0);
  const opts=[0,25,50,75,100].map(x=>[String(x),x+'%']);
  const pc=v=>num(v)>=100?'p100':num(v)>0?'ppart':'';
  const ncol=9+d.stages.length+d.itps.length;
  const n=d.stages.length,per=a.per,share=i=>per?num(d.stages[i].rate)/per:(n?1/n:0);
  const body=shown.map(({x,si})=>{
    const lines=x.lines.map((l,li)=>({l,li})).filter(o=>lineMatch(o.l,q));
    if(q&&!lines.length)return '';
    const sc=a.secs[x.id]||{total:0,claimed:0,count:0};const ka='tsec|'+t+'|'+si+'|';
    return `<tr class="secrow"><td colspan="3">${inp(ka+'name',x.name,{label:'Section name',ph:'Section name'})}</td><td colspan="${ncol-6}" class="hint">${sc.count} line${sc.count===1?'':'s'} · <span class="money">${money(sc.claimed)} / ${money(sc.total)}</span> · ${pct(sc.total?sc.claimed/sc.total:0,0)}</td><td colspan="2"></td><td style="text-align:right">${delBtn('sec',t,String(si),'Remove section')}</td></tr>`+
    lines.map(({l,li})=>{const st=d.units[l.id]||{s:{},itp:{}};const k='apt|'+t+'|'+l.id+'|';const kl='tline|'+t+'|'+si+'|'+li+'|';
      const lab=(l.desc||l.name||('Line '+(si+1)+'.'+(li+1)));const num0=`${si+1}.${li+1}`;
      if(l.subs&&l.subs.length){
        let v=0,uc=0;const xs=l.subs.map(sb=>{const x=subCalc(d,sb);v+=x.v;uc+=x.c;return x});
        const nS=d.stages.length;
        return `<tr class="parentrow"><td style="width:86px">${delBtn('line',t,si+'.'+li,'Remove')}</td><td class="mono hint" style="width:48px;white-space:nowrap"><button class="tog" data-act="tog-sub" data-v="${esc(l.id)}" aria-expanded="${!COLL.has(l.id)}" aria-label="${COLL.has(l.id)?'Show':'Hide'} sub-lines" title="${COLL.has(l.id)?'Show':'Hide'} sub-lines">${COLL.has(l.id)?'▸':'▾'}</button>${num0}</td><td style="min-width:200px">${inp(kl+'desc',l.desc||l.name||'',{label:'Description',ph:'Description (optional)'})}</td><td style="width:150px">${itpCell('tline|'+t+'|'+si+'|'+li,l.itpFile)}</td>
        <td colspan="${2+nS+d.itps.length}" class="hint">${COLL.has(l.id)?'<span class="tag acc" style="margin-right:4px">Minimised</span>':''}Split into ${l.subs.length} task${l.subs.length===1?'':'s'} · <button class="btn ghost" style="padding:2px 6px;font-size:12px" data-act="unsplit" data-id="${t}" data-x="${si}.${li}">${UI.armed==='unsplit'+t+si+'.'+li?'Confirm merge (tasks without a stage are dropped)':'Merge back'}</button></td>
        <td class="n money"><b>${money(v)}</b></td><td class="n money"><b>${money(uc)}</b></td><td class="n"><b>${v?pct(uc/v,0):'—'}</b></td></tr>`+
        (COLL.has(l.id)?'':l.subs.map((sb,ji)=>{const x=xs[ji];const ks='tsub|'+t+'|'+si+'|'+li+'|'+ji+'|';const sg=d.stages.find(z=>z.id===sb.task);
          return `<tr class="subrow"><td style="width:86px">${delBtn('sub',t,si+'.'+li+'.'+ji,'Remove')}</td><td class="mono hint">${num0}.${ji+1}</td>
          <td><div class="subtask">${sel(ks+'task',sb.task||'',[['','Other task'],...d.stages.map(z=>[z.id,z.name||'Unnamed stage'])],{label:'Task'})}${inp(ks+'desc',sb.desc,{label:'Task description',ph:sg?sg.name:'Task description'})}</div></td>
          <td>${itpCell('tsub|'+t+'|'+si+'|'+li+'|'+ji,sb.itpFile)}</td>
          <td>${inp(ks+'qty',sb.qty,{num:1,label:'Quantity',ph:'1'})}</td><td><div class="cur">${inp(ks+'rate',sb.rate,{num:1,label:'Rate',ph:String(sg?num(sg.rate):0)})}</div></td>
          <td colspan="${Math.max(nS,1)}">${sel(ks+'pct',String(num(sb.pct)),opts,{label:'% complete',cls:pc(sb.pct)})}</td>${d.itps.map(()=>'<td></td>').join('')}
          <td class="n money">${money(x.v)}</td><td class="n money">${money(x.c)}</td><td class="n">${x.v?pct(x.p,0):'—'}</td></tr>`}).join('')+
        `<tr class="subadd"><td></td><td colspan="${ncol-1}"><button class="btn ghost" style="font-size:12px;color:var(--accent)" data-act="add-sub" data-id="${t}" data-x="${si}.${li}">+ Add task to line ${num0}</button></td></tr>`);
      }
      const v=(num(l.rate)||per)*lineQty(l);let uc=0;d.stages.forEach((s,i)=>uc+=v*share(i)*num(st.s?.[s.id])/100);
      return `<tr><td style="width:86px">${delBtn('line',t,si+'.'+li,'Remove')}</td><td class="mono hint" style="width:48px">${num0}</td><td style="min-width:200px"><div class="subtask">${inp(kl+'desc',l.desc||l.name||'',{label:'Description',ph:'Description (optional)'})}<button class="btn ghost splitbtn" data-act="split" data-id="${t}" data-x="${si}.${li}" title="Split this line into separate tasks">Split</button></div></td><td style="width:150px">${itpCell('tline|'+t+'|'+si+'|'+li,l.itpFile)}</td>
      <td style="width:64px">${inp(kl+'qty',l.qty,{num:1,label:'Quantity',ph:'1'})}</td><td style="width:120px"><div class="cur">${inp(kl+'rate',l.rate,{num:1,label:'Rate',ph:String(per)})}</div></td>
      ${d.stages.map(s=>{const p=num(st.s?.[s.id]);return `<td>${sel(k+'s:'+s.id,String(p),opts,{label:lab+' '+s.name,cls:pc(p)})}</td>`}).join('')}
      ${d.itps.map(x2=>`<td style="text-align:center"><input type="checkbox" id="${'apt_'+t+'_'+l.id+'_itp_'+x2.id}" data-b="${k}itp:${x2.id}" ${st.itp?.[x2.id]?'checked':''} aria-label="${esc(lab+' '+x2.name)}"></td>`).join('')}
      <td class="n money">${money(v)}</td><td class="n money">${money(uc)}</td><td class="n">${v?pct(uc/v,0):'—'}</td></tr>`}).join('')+(q?'':`<tr class="addrow"><td colspan="${ncol}"><button class="btn" data-act="add-line" data-id="${t}" data-s="${si}">+ Add line to ${esc(x.name||'this section')}</button></td></tr>`);
  }).join('');
  return `<div class="stack">${hd}${chips}
  ${UI.setup?setupPanel(t,d):''}
  <div class="kpis">
    <div class="kpi"><span class="l">Lines</span><span class="v">${a.count}</span><span class="d">${a.full} fully complete · ${d.sections.length} section${d.sections.length===1?'':'s'}</span></div>
    <div class="kpi"><span class="l">Contract value</span><span class="v">${kmoney(a.total)}</span><span class="d">${money(a.per)} standard rate per line</span></div>
    <div class="kpi"><span class="l">Claimed</span><span class="v">${kmoney(a.claimed)}</span><span class="d">${pct(a.pct)} complete</span></div>
    <div class="kpi"><span class="l">Left to claim</span><span class="v">${kmoney(a.total-a.claimed)}</span><span class="d">${d.itps.map(x=>`${a.itp[x.id]||0} ${esc(x.name||'checks')}`).join(' · ')||'No inspections set up'}</span></div>
  </div>
  <div class="panel"><div class="sec-head" style="margin-bottom:10px"><div><h3>Claim stages</h3><p class="hint">The stages each line is claimed against. Their rates add up to the standard rate per line.</p></div><button class="btn" data-act="add-stage" data-id="${t}">+ Add stage</button></div>
  ${d.stages.length?`<div class="tw"><table><thead><tr><th></th><th style="min-width:200px">Stage</th><th class="n">Standard rate</th><th class="n">Stage value</th><th class="n">Claimed</th><th style="width:22%">Progress</th><th class="n">Lines at 100%</th></tr></thead><tbody>
    ${a.stage.map((s2,i)=>`<tr><td style="width:86px">${delBtn('stage',t,String(i),'Remove')}</td><td>${inp('tstage|'+t+'|'+i+'|name',d.stages[i].name,{label:'Stage name',ph:'e.g. Rough-in'})}</td><td style="width:130px"><div class="cur">${inp('tstage|'+t+'|'+i+'|rate',d.stages[i].rate,{num:1,label:'Standard rate'})}</div></td><td class="n money">${money(s2.total)}</td><td class="n money">${money(s2.claimed)}</td><td><div class="bar"><i style="width:${s2.total?(s2.claimed/s2.total*100).toFixed(1):0}%"></i></div></td><td class="n">${s2.done}</td></tr>`).join('')}
  </tbody><tfoot><tr><td></td><td>Total</td><td class="n money">${money(a.per)}</td><td class="n money">${money(a.total)}</td><td class="n money">${money(a.claimed)}</td><td></td><td></td></tr></tfoot></table></div>`:`<div class="empty"><b>No claim stages</b>Add the stages this subcontractor claims against, such as rough-in and fit-off.</div>`}</div>
  <div class="panel" style="padding:12px 14px"><div class="toolbar">

    <label>Find <input id="apt_q" data-ui="q" value="${esc(UI.q)}" placeholder="Line or description" style="width:150px"></label>

    <span style="flex:1"></span>
    ${d.stages.length?`<label>Set <select id="apt_bs" data-ui="bulkStage">${d.stages.map(x=>`<option value="${x.id}"${UI.bulkStage===x.id?' selected':''}>${esc(x.name||'Unnamed stage')}</option>`).join('')}</select></label>
    <label>to <select id="apt_bp" data-ui="bulkPct">${opts.map(([v,x])=>`<option value="${v}"${UI.bulkPct===v?' selected':''}>${x}</option>`).join('')}</select></label>
    <button class="btn" data-act="bulk">Apply to ${nLines} shown</button>`:''}
  </div></div>
  <div class="tw tall apt"><table><thead><tr><th></th><th>#</th><th style="min-width:340px">Description</th><th>ITP</th><th class="n">Qty</th><th class="n">Rate</th>${d.stages.map(x=>`<th>${esc(x.name||'Unnamed stage')}</th>`).join('')}${d.itps.map(x=>`<th>${esc(x.name||'Check')}</th>`).join('')}<th class="n">Value</th><th class="n">Claimed</th><th class="n">Complete</th></tr></thead><tbody>
  ${body||`<tr><td colspan="${ncol}" class="empty">${d.sections.length?'No lines match.':'No sections yet. Add one below.'}</td></tr>`}

  <div class="toolbar"><button class="btn primary" data-act="add-sec" data-id="${t}">+ Add section</button><span class="hint">Sections group lines, for example a level, a building or common areas.</span></div></div>`;
};

function allLinesPanel(){

  return {sum,claimed,prev,this:claimed-prev,ap,assessed,pay:assessed-prev,diff:(assessed-prev)-(claimed-prev)}}
function pcSum(lines){const t={sum:0,claimed:0,prev:0,this:0,assessed:0,pay:0,diff:0};for(const l of lines){const x=pcLine(l);for(const k in t)t[k]+=x[k]}return t}

/* ---------- editing ---------- */
function apply(parts,v){
  const [kind,a,b,c,d]=parts;
  if(kind==='info'){S.info[a]=v;persist('project/info');if(a==='name'){PROJ[PID]={...(PROJ[PID]||{created:PID==='main'?1:Date.now()}),name:v};persist('projects/'+PID);renderChrome()}return}
  if(kind==='cs'){S.info.cs=S.info.cs||{};S.info.cs[a]=S.info.cs[a]||{};S.info.cs[a][b]=v;persist('project/info');return}
  if(kind==='cashstart'){S.cash.start=v;persist('project/cashflow');return}
  if(kind==='cash'){S.cash.m[a]=S.cash.m[a]||{};S.cash.m[a][b]=v;persist('project/cashflow');return}
  if(kind==='crew'){if(!S.crew.rows)S.crew.rows=clone(CREW_DEFAULT);S.crew.rows[+a][b]=v;persist('project/crew');return}
  if(kind==='var'){if(S.vars[a]){S.vars[a][b]=v;persist('variations/'+a);if(b==='status')syncClaimVar(a)}return}
  if(kind==='vbu'){const x=S.vars[a];if(!x)return;x.bu=x.bu||VBU_DEF();if(b.startsWith('r_')){x.bu.rates=x.bu.rates||{};x.bu.rates[b.slice(2)]=v}else x.bu[b]=v;persist('variations/'+a);return}
  if(kind==='vq'){const x=S.vars[a];if(!x)return;x.bu=x.bu||VBU_DEF();x.bu.quoteFile=v;persist('variations/'+a);return}
  if(kind==='vline'){const x=S.vars[a];if(!x)return;x.bu=x.bu||VBU_DEF();const l=x.bu.lines[+b];if(l){l[c]=v;persist('variations/'+a)}return}
  if(kind==='ord'){if(S.orders[a]){S.orders[a][b]=v;persist('orders/'+a)}return}
  if(kind==='inv'){const o=S.orders[a];if(o&&o.inv[+b]){o.inv[+b][c]=v;persist('orders/'+a)}return}
  if(kind==='proc'){if(S.procs[a]){S.procs[a][b]=v;persist('procurement/'+a)}return}
  if(kind==='llog'){if(S.llog.rows[+a]){S.llog.rows[+a][b]=v;persist('project/labourlog')}return}
  if(kind==='pc'){claimDoc().hdr[a]=v;persist('project/claim');return}
  if(kind==='pcret'){claimDoc().retMax=v;persist('project/claim');return}
  if(kind==='pcsec'){const d=claimDoc();if(d.secs[+a]){d.secs[+a][b]=v;persist('project/claim')}return}
  if(kind==='pcl'){const d=claimDoc();const L=a==='c'?d.secs[+b]?.lines:a==='a'?d.av:d.pv;const l=L&&L[+c];if(!l)return;const f=parts[4];const sm=num(l.sum),pv=num(l.prev);
    const P=x=>sm?String(Math.round(x/sm*1e8)/1e6):'';
    if(f==='amtC')l.pct=P(num(v));else if(f==='thisC')l.pct=P(pv+num(v));else if(f==='amtA')l.apct=v===''?'':P(num(v));else if(f==='payA')l.apct=v===''?'':P(pv+num(v));else l[f]=v;
    if((f==='amtA'||f==='payA'||f==='apct')&&l.apct!=='')l.pct=l.apct;
    persist('project/claim');return}
  if(kind==='pch'){const d=claimDoc();if(d.hist[+a]){d.hist[+a][b]=v;persist('project/claim')}return}
  if(kind==='tksec'){const d=ensureTask(a);if(d.sections[+b]){d.sections[+b][c]=v;persist('tasks/'+a)}return}

/* ---------- projects ---------- */
let unsubs=[];
function blankState(){Object.assign(S,{llog:{rows:[]},info:{},cash:{start:'',m:{}},crew:{rows:null},vars:{},orders:{},procs:{},tasks:{},apt:{},claim:null})}
async function flushAll(){const keys=Object.keys(pending);await Promise.all(keys.map(k=>{clearTimeout(pending[k]);return flush(k)}))}
function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  if(!db)return;const err=e=>{console.error(e)};
  for(const name of ['project','variations','orders','procurement','tasks','apartments'])unsubs.push(db.collection(physColl(name)).onSnapshot(s=>onColl(name,s),err));
}
async function switchProject(id){
  if(id===PID)return;
  if(S.info.name&&!PROJ[PID]?.name){PROJ[PID]={...(PROJ[PID]||{created:PID==='main'?1:Date.now()}),name:S.info.name};persist('projects/'+PID)}
  await flushAll();
  PID=id;try{localStorage.setItem('ox_pid',id)}catch(e){}
  blankState();for(const k of Object.keys(aptQueue))delete aptQueue[k];exists.clear();deleted.clear();structDirty.clear();for(const k in latest)delete latest[k];
  UI.bld='';UI.level='all';UI.q='';UI.task='t01';UI.setup=false;UI.armed=null;UI.view='overview';
  subscribe();render();window.scrollTo(0,0);
}
function commitRename(id){
  const el=document.getElementById('prename_'+id);UI.renaming=null;
  const v=el?el.value.trim():'';
  if(v){PROJ[id]={...(PROJ[id]||{created:id==='main'?1:Date.now()}),name:v};persist('projects/'+id);if(id===PID){S.info.name=v;persist('project/info')}}
  render();
}
async function removeProject(id){
  const others=projList().filter(x=>x.id!==id);if(!others.length)return;
  PROJ[id]={...(PROJ[id]||{created:id==='main'?1:Date.now(),name:projName(id)}),removed:true,removedAt:Date.now()};persist('projects/'+id);
  if(id===PID)await switchProject(others[0].id);else render();
}

document.addEventListener('click',async e=>{const a=e.target.closest&&e.target.closest('a[data-file]');if(!a||!HOSTED||!window.__sb)return;e.preventDefault();
  const w=window.oxDesktop?null:window.open('','_blank');try{const {data,error}=await window.__sb.storage.from('files').createSignedUrl(a.dataset.file,600);if(error)throw error;if(window.oxDesktop)window.oxDesktop.openExternal(data.signedUrl);else if(w)w.location=data.signedUrl;else location.href=data.signedUrl}catch(err){if(w)w.close();setSave('error','Could not open the file')}});
function jsonMerge(a,b){if(!a||typeof a!=='object'||Array.isArray(a))a={};const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v))?jsonMerge(a[k],v):v}return o}
function makeSbDb(sb){
  const parent=p=>p.split('/').slice(0,-1).join('/');const T='docs';
  const listeners={};
  async function fetchColl(c){const {data,error}=await sb.from(T).select('path,data').eq('coll',c);if(error)throw error;return data}
  async function emit(c){const L=listeners[c];if(!L||!L.size)return;try{const rows=await fetchColl(c);const snap={docs:rows.map(r=>({id:r.path.split('/').pop(),exists:true,data:()=>r.data})),metadata:{fromCache:false,hasPendingWrites:false}};snap.size=snap.docs.length;snap.empty=!snap.size;for(const f of L)f.next(snap)}catch(e){for(const f of L)f.err&&f.err(e)}}
  const timers={};const bump=c=>{clearTimeout(timers[c]);timers[c]=setTimeout(()=>emit(c),120)};
  sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path);if(p)bump(parent(p))}).subscribe();
  setInterval(()=>{for(const c in listeners)if(listeners[c].size)emit(c)},60000);
  return {
    doc(p){return {
      async set(data){const {error}=await sb.from(T).upsert({path:p,coll:parent(p),data,updated_at:new Date().toISOString()});if(error)throw Object.assign(error,{code:'unavailable'})},
      async update(patch){const {data:row,error:e1}=await sb.from(T).select('data').eq('path',p).maybeSingle();if(e1)throw e1;if(!row)throw {code:'invalid_argument',message:'missing'};
        const {error}=await sb.from(T).update({data:jsonMerge(row.data,patch),updated_at:new Date().toISOString()}).eq('path',p);if(error)throw error},
      async delete(){const {error}=await sb.from(T).delete().eq('path',p);if(error)throw error},
      async get(){const {data}=await sb.from(T).select('data').eq('path',p).maybeSingle();return {id:p.split('/').pop(),exists:!!data,data:()=>data&&data.data}}
    }},
    collection(c){return {onSnapshot(next,err){const f={next,err};(listeners[c]=listeners[c]||new Set()).add(f);emit(c);return ()=>listeners[c].delete(f)}}}
  };
}
function makeSbAssets(sb){return {
  async upload(file,opts){const id=(crypto.randomUUID?crypto.randomUUID():uid('f'))+'.pdf';const {error}=await sb.storage.from('files').upload(id,file,{contentType:(opts&&opts.type)||file.type||'application/pdf',upsert:false});if(error)throw Object.assign(error,{code:'upstream_error'});return {id,url:'#'}},
  async delete(id){await sb.storage.from('files').remove([id]);return {deleted:true}}
}}

function loginScreen(sb,msg){

    <div id="step1"><label for="loginemail">Email</label><input class="f" id="loginemail" type="email" required autocomplete="email" placeholder="name@oxfordgroup.com.au"></div>
    <div id="step2" hidden><label for="logincode">Sign-in code</label><input class="f" id="logincode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></div>

    <p class="hint" id="loginmsg">${esc(msg||'')}</p></form>`;
  document.body.appendChild(el);
  const $=q=>el.querySelector(q);let stage=1;
  if(window.oxDesktop&&$('#loginsettings'))$('#loginsettings').onclick=()=>window.oxDesktop.openSettings();
  $('#loginback').onclick=()=>{stage=1;$('#step1').hidden=false;$('#step2').hidden=true;$('#loginback').hidden=true;$('#loginbtn').textContent='Email me a code';$('#loginmsg').textContent=''};
  $('#loginform').addEventListener('submit',async ev=>{ev.preventDefault();const em=$('#loginemail').value.trim();const m=$('#loginmsg');const b=$('#loginbtn');b.disabled=true;
    if(stage===1){m.textContent='Sending…';
      const opts={shouldCreateUser:true};if(web)opts.emailRedirectTo=location.origin+location.pathname;
      const {error}=await sb.auth.signInWithOtp({email:em,options:opts});b.disabled=false;
      if(error){m.textContent=/signups? not allowed|not found|Invalid/i.test(error.message)?'That email has not been invited yet. Ask the app owner to invite you.':'Could not send the code: '+error.message;return}
      stage=2;$('#step1').hidden=true;$('#step2').hidden=false;$('#loginback').hidden=false;b.textContent='Sign in';m.textContent='We’ve emailed a code to '+em+'. Type it here'+(web?', or click the link in the email.':'.');setTimeout(()=>$('#logincode').focus(),30);return}
    m.textContent='Checking…';const {error}=await sb.auth.verifyOtp({email:em,token:$('#logincode').value.trim(),type:'email'});b.disabled=false;
    if(error){m.textContent='That code didn’t work. Check it and try again, or request a new one.';return}
    location.reload()});
}

async function hostedBoot(startStore,offline){
  const C=window.OX_CONFIG||{};
  if(!window.supabase||!C.supabaseUrl||!C.supabaseAnonKey||/YOUR_/.test(C.supabaseUrl+C.supabaseAnonKey)){document.getElementById('banner').innerHTML='<div class="banner">This copy of the app is not connected to a database yet. '+(window.oxDesktop?'Open <b>Connection settings</b> from the app menu and enter your Supabase details.':'Add your Supabase URL and key to config.js (see the setup guide).')+'</div>';setSave('local');return}
  const sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,detectSessionInUrl:true}});window.__sb=sb;
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginScreen(sb);sb.auth.onAuthStateChange((ev,s2)=>{if(s2&&ev==='SIGNED_IN')location.reload()});setSave('local');document.getElementById('savepill').textContent='Signed out';return}
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload()});
  const myEmail=(session.user.email||'').toLowerCase();
  const {data:meRow,error:meErr}=await sb.from('team').select('*').eq('email',myEmail).maybeSingle();
  if(meErr){document.getElementById('banner').innerHTML='<div class="banner">Could not check your access: '+esc(meErr.message)+'. Has supabase-setup.sql been run?</div>';setSave('error','No connection');return}
  if(!meRow){noAccess(sb,myEmail);setSave('local');document.getElementById('savepill').textContent='No access';return}
  window.__me=meRow;
  document.getElementById('whoami').innerHTML=`<div class="who">${esc(session.user.email||'')}<button class="addproj" id="signout" type="button">Sign out</button>${window.oxDesktop?'<button class="addproj" id="oxsettings" type="button">Connection settings</button>':''}</div>`;
  document.getElementById('signout').onclick=()=>sb.auth.signOut();if(window.oxDesktop)document.getElementById('oxsettings').onclick=()=>window.oxDesktop.openSettings();
  assets=makeSbAssets(sb);downloads=browserDownloads;
  startStore(makeSbDb(sb));render();
}

/* ---------- boot ---------- */
(function(){
  let h=(location.hash||'').slice(1);if(h==='apartments')h='subcontractors';if(VIEWS_LIST.some(v=>v[0]===h))UI.view=h;
  render();setSave('saving');document.getElementById('savepill').textContent='Connecting';
  const timeout=setTimeout(()=>{if(!db)offline()},12000);
  function offline(){
    setSave('local');
    document.getElementById('banner').innerHTML='<div class="banner">This view can’t reach the shared project store, so edits stay in this browser tab only and are lost on reload. Open the page from claude.ai while signed in to save and share changes.</div>';
  }
  if(HOSTED){clearTimeout(timeout);hostedBoot(startStore,offline);return}
  if(!window.claude||!window.claude.use){clearTimeout(timeout);offline();return}
  window.claude.use('db').then(d=>{
    clearTimeout(timeout);
    if(!d){offline();return}
    window.claude.use('assets').then(a=>{assets=a;render()}).catch(()=>{});
    window.claude.use('downloads').then(x=>{downloads=x}).catch(()=>{});
    startStore(d);
  }).catch(()=>{clearTimeout(timeout);offline()});
  function startStore(d){
    db=d;setSave('saved');
    db.collection('projects').onSnapshot(sn=>{for(const k in PROJ)if(!isDirty('projects/'+k))delete PROJ[k];for(const d of sn.docs)if(!isDirty('projects/'+d.id))PROJ[d.id]=clone(d.data());
      if(PID!=='main'&&!PROJ[PID]&&!isDirty('projects/'+PID)&&!sn.metadata.fromCache){PID='main';try{localStorage.setItem('ox_pid','main')}catch(e){}blankState();subscribe()}
      scheduleRender()},e=>console.error(e));
    subscribe();
  }
})();
