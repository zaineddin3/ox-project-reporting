<title>Oxford Project Reporting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a dark switchboard-style rail lists the report sections (the workbook's tabs); the work surface scrolls beside it. Under 860px the rail becomes a sticky scrolling tab strip. */
:root{
  --bg:#f1f2ef; --surface:#ffffff; --ink:#1a232d; --muted:#5b6672; --line:#d8dcd6; --soft:#e9ebe6;
  --accent:#b0541c; --accent-soft:#f5e3d6; --accent-ink:#ffffff;
  --rail:#1c2732; --rail-ink:#c9d2db; --rail-hi:#ffffff;
  --series2:#386a96; --good:#2b7a4b; --good-soft:#dcefe3; --warn:#9a6a08; --warn-soft:#f6ebcf; --bad:#b0352a; --bad-soft:#f6dcd8;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#171f28; --ink:#e3e8ed; --muted:#95a1ae; --line:#2a3541; --soft:#1e2832;
  --accent:#e2884d; --accent-soft:#3a2618; --accent-ink:#1a1008;
  --rail:#0b1015; --rail-ink:#aeb9c4; --rail-hi:#ffffff;
  --series2:#7eb0dc; --good:#5cc088; --good-soft:#163024; --warn:#e2b44c; --warn-soft:#33290f; --bad:#ef6f62; --bad-soft:#3a1916;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#171f28; --ink:#e3e8ed; --muted:#95a1ae; --line:#2a3541; --soft:#1e2832;
  --accent:#e2884d; --accent-soft:#3a2618; --accent-ink:#1a1008;
  --rail:#0b1015; --rail-ink:#aeb9c4; --rail-hi:#ffffff;
  --series2:#7eb0dc; --good:#5cc088; --good-soft:#163024; --warn:#e2b44c; --warn-soft:#33290f; --bad:#ef6f62; --bad-soft:#3a1916;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center}
.brand .mark{width:38px;height:38px;border:2px solid var(--accent);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--rail-hi);letter-spacing:.04em}
.brand .t{font-family:var(--f-display);font-weight:600;color:var(--rail-hi);font-size:17px;line-height:1.1}
.brand .s{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px}
.nav button .n{font-family:var(--f-mono);font-size:11px;opacity:.55;width:18px}
.nav button:hover{background:color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav button[aria-current="true"] .n{opacity:.8}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ptree{display:flex;flex-direction:column;gap:4px}
.plabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:0 10px 2px}
.pgroup{display:flex;flex-direction:column;gap:2px}
.pgroup.open{background:color-mix(in srgb,var(--rail-ink) 6%,transparent);border-radius:8px;padding:2px 0 6px}
.proj{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--rail-hi)}
.proj .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .caret{width:12px;font-size:11px;opacity:.7}
.proj:hover{background:color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.proj:focus-visible,.addproj:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pgroup .nav{padding-left:12px}
.addproj{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--accent);font-weight:600}
.addproj:hover{background:color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.projsel{display:none}
.pgroup.shut .nav{display:none}
.pcaret{all:unset;cursor:pointer;width:22px;height:30px;display:grid;place-items:center;color:var(--rail-ink);font-size:11px;border-radius:5px;flex:0 0 22px}
.pcaret:hover{background:color-mix(in srgb,var(--rail-ink) 12%,transparent)}
.pcaret:focus-visible{outline:2px solid var(--accent)}
.proj.cur .pn{color:var(--rail-hi)}
.pgroup:not(.active) .proj{font-weight:500;opacity:.85}
.pgroup.open:not(.active){background:color-mix(in srgb,var(--rail-ink) 3%,transparent)}
.prow{display:flex;align-items:center;gap:2px;min-width:0}
.prow .proj{flex:1;min-width:0}
.pacts{display:none}
.prow:hover .pacts,.prow:focus-within .pacts,.pgroup.open .pacts{display:flex}
.pact{all:unset;cursor:pointer;padding:5px 7px;border-radius:5px;font-size:12px;color:var(--rail-ink);opacity:.8}
.pact:hover{background:color-mix(in srgb,var(--rail-ink) 14%,transparent);opacity:1}
.pact:focus-visible{outline:2px solid var(--accent)}
.pact.danger{background:var(--bad);color:#fff;opacity:1;font-weight:600}
.prow.confirm{padding:6px 8px;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--rail-hi)}
.prow.confirm .pn{flex-basis:100%}
.prename{flex:1;min-width:0;background:var(--rail);color:var(--rail-hi);border:1px solid var(--accent);border-radius:5px;padding:6px 8px;font:600 15px var(--f-display)}
.prename:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.rail .foot{margin-top:auto;font-size:11.5px;opacity:.7;line-height:1.4}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,min(4vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px),min(4vw,40px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.top .meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:13px;margin-top:6px}
.top .meta b{color:var(--ink);font-weight:600}
.calcframe{display:block;width:100%;height:calc(100vh - 190px);min-height:640px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
.vplus{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;margin-right:6px;vertical-align:middle}.vplus:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vplus-gap{display:inline-block;width:22px;margin-right:6px}
.vsrc-tog{all:unset;cursor:pointer;display:block;color:var(--accent);font-size:10.5px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.vsrc-tog:focus-visible{outline:2px solid var(--accent)}
tr.vparts>td{background:var(--soft);padding-top:4px;padding-bottom:10px}.vparts-box{max-width:720px}.vparts-box table{width:100%;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.vparts-box th,.vparts-box td{padding:5px 8px}.vparts-box tr.vmain td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.vsrc{font-size:10.5px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
td.vov .f{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.vpick-ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 35%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 16px}
.vpick{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:82vh;display:flex;flex-direction:column;gap:10px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.vpick-list{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:80px}
.vpk{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.vpkd{flex:1;min-width:0}
.toprt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.undobar{display:flex;gap:6px}.undobar .btn{padding:4px 10px;font-size:12.5px}.undobar .btn:disabled{opacity:.4;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.busy{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;line-height:1.15}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;line-height:1.2}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px;margin-bottom:12px}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.stack{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel > h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px}
.bw{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:color-mix(in srgb,var(--accent) 4%,var(--surface))}.bw-q{display:flex;flex-direction:column;gap:6px;font-weight:500;max-width:420px}.bw-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.bw-sum{margin:0 0 10px;display:flex;gap:6px;flex-wrap:wrap}.bw-all{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}.bw-tab td{padding:4px 6px}.bw-all .f{border:1px solid var(--line);background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.mono{font-family:var(--f-mono);font-size:12.5px}
tfoot td{font-weight:600;background:var(--soft);border-top:1px solid var(--line);border-bottom:0}
.money{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.ledger td{padding:6px 0;border-bottom:1px dashed var(--line)}
.ledger td:last-child{text-align:right}
.ledger tr.total td{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:600;padding-top:8px}
.ledger tr.sub td{color:var(--muted);font-size:13px}
input.f,select.f,textarea.f{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:5px;padding:5px 7px}
input.f:hover,select.f:hover,textarea.f:hover{border-color:var(--line)}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
input.f.num{text-align:right;font-family:var(--f-mono);font-size:12.5px}
input.f::placeholder,textarea.f::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.form label .f{border-color:var(--line);text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400;background:var(--surface)}
.form label.wide{grid-column:1/-1}
textarea.f{resize:vertical;min-height:84px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;font-weight:600;margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.b2 > i{background:var(--series2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)}
.cur{position:relative}
.cur::before{content:"$";position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-mono);font-size:12.5px;pointer-events:none}
.cur input.f{padding-left:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
tr.subtot td{background:var(--soft);font-weight:600;border-bottom:2px solid var(--line)}
tr.grand td{background:var(--ink);color:var(--surface);font-weight:600}
tr.grand td.neg{color:var(--bad-soft)}
.form input.f:disabled{opacity:.7}
.addrow td{padding:6px 8px;border-bottom:2px solid var(--line)}
.secrow td{background:var(--soft);padding:6px 8px}
.secrow input.f{font-family:var(--f-display);font-weight:600;font-size:15px}
.itp{display:flex;align-items:center;gap:2px;white-space:nowrap}
.itp-file{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;background:var(--good-soft);color:var(--good);font-weight:600;font-size:12px;text-decoration:none}
.itp-file::before{content:"";width:9px;height:11px;border:1.5px solid currentColor;border-radius:1px}
.itp-file:hover{text-decoration:underline}
.itp-act{padding:3px 6px;font-size:12px}
.itp-up{padding:4px 10px;font-size:12px;white-space:nowrap;cursor:pointer}
.cur.strong input.f{font-weight:700}
.pcbar{display:flex;flex-direction:column;gap:3px}
.bar.thin{height:4px}
.pcbar-l{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:11.5px;margin-top:3px}
.tog{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:20px;height:20px;margin-right:4px;border-radius:4px;color:var(--ink);font-size:12px}
.tog:hover{background:var(--soft)}
.tog:focus-visible{outline:2px solid var(--accent)}
.subtask{display:flex;gap:6px;align-items:center}
.subtask select.f{width:150px;flex:0 0 150px}
.subtask input.f{flex:1;min-width:120px}
tr.subrow select.f[data-b$='|pct']{width:110px}
.splitbtn{padding:3px 8px;font-size:12px;color:var(--accent);opacity:.75;white-space:nowrap}
tr:hover .splitbtn{opacity:1}
tr.parentrow td{border-bottom-style:dashed}
tr.subrow input.f.num{min-width:72px}
tr.subrow input.f:not(.num){min-width:60px}
tr.subrow td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
tr.subrow td:nth-child(2){padding-left:18px}
tr.subadd td{padding:2px 8px 6px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.bumini{padding:4px 0 8px;max-width:1150px}
.bumini table{background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.bumini th{position:static;font-size:10.5px;padding:5px 8px}.bumini td{padding:4px 8px}
.bumini-sum{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.bumini-sum b{color:var(--ink);font-family:var(--f-mono);font-weight:500;margin-left:3px}
.bumini-sum .tot b{font-weight:700}
.revline{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}
.revtog{padding:1px 6px;font-size:11.5px;color:var(--accent)}
tr.revrow.revcur td{background:var(--accent-soft)}
tr.bmrow td{padding-top:0}
tr.revrow td{background:color-mix(in srgb,var(--soft) 50%,transparent);font-size:13px}
.form .btn{text-transform:none;letter-spacing:0}
.markups{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mk-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400}
.mk-item{display:inline-flex;align-items:center;gap:2px}
.pdfval{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;padding:4px 2px}
.extmsg{font-size:12.5px;padding:6px 10px;border-radius:6px;margin-left:2px}
.extmsg.busy{background:var(--warn-soft);color:var(--warn)}.extmsg.ok{background:var(--good-soft);color:var(--good)}.extmsg.err{background:var(--bad-soft);color:var(--bad)}

.invmat th{position:static}
.bupanel{padding:16px 18px 20px;background:var(--surface);border-top:2px solid var(--accent);display:flex;flex-direction:column;gap:6px}
.form.rates{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.bu-sum td{padding:6px 8px}

.tender label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tender label .f{border-color:var(--line);font-size:14px;color:var(--ink);background:var(--surface)}
