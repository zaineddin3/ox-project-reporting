mula evaluator (linked quantities from the original sheets) ---------- */\nfunction compile(src){\n  let i=0; const s=src.replace(/\\s+/g,'');\n  function num(){ const m=/^\\d+(\\.\\d+)?/.exec(s.slice(i)); i+=m[0].length; return +m[0]; }\n  function expect(c){ if(s[i]!==c) throw new Error('bad formula '+src); i++; }\n  function factor(){\n    if(s[i]==='('){ i++; const e=expr(); expect(')'); return e; }\n    if(s[i]==='-'){ i++; const f=factor(); return (Q,R)=>-f(Q,R); }\n    if(s.startsWith('UP(',i)){ i+=3; const a=expr(); expect(','); const b=expr(); expect(')'); return (Q,R)=>{const p=Math.pow(10,b(Q,R)); const v=a(Q,R); return Math.sign(v)*Math.ceil(Math.abs(v)*p-1e-9)/p;}; }\n    if(s.startsWith('Q(',i)){ i+=2; const n=num(); expect(')'); return (Q)=>Q(n); }\n    if(s.startsWith('R(',i)){ i+=2; const a=num(); expect(','); const b=num(); expect(')'); return (Q,R)=>R(a,b); }\n    const n=num(); return ()=>n;\n  }\n  function term(){ let f=factor(); while(s[i]==='*'||s[i]==='/'){ const op=s[i++]; const g=factor(), h=f; f= op==='*'?(Q,R)=>h(Q,R)*g(Q,R):(Q,R)=>{const d=g(Q,R); return d? h(Q,R)/d:0;}; } return f; }\n  function expr(){ let f=term(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++]; const g=term(), h=f; f= op==='+'?(Q,R)=>h(Q,R)+g(Q,R):(Q,R)=>h(Q,R)-g(Q,R); } return f; }\n  const f=expr(); if(i!==s.length) throw new Error('bad formula '+src); return f;\n}\nconst FN = {};\nfunction fnFor(c,row){ const k=c.id+'#'+row; if(!(k in FN)){ const r=c.items[row]; FN[k]= r&&r[8]? compile(r[8]) : null; } return FN[k]; }\n\n/* ---------- estimate state ---------- */\nconst DEFAULT_SECTIONS = ()=>Array.from({length:MAXSEC},(_,i)=>'Section '+(i+1));\nconst DEFAULT_SUBS = ()=>Array.from({length:MAXSEC},()=>[{id:'g',name:'General'}]);\n/* quantities are kept per bucket: \"<section>.<sub-section id>\" */\nfunction toBuckets(v){ if(!Array.isArray(v)){ const o={}; for(const k in (v||{})){ const p=k.split('.'); o[p.length<3?p[0]+'.'+(p[1]||'g')+'.h':k]=v[k]; } return o; } const o={}; v.forEach((x,s)=>{ if(+x) o[s+'.g.h']=+x; }); return o; }\nfunction migrateQ(q){ for(const c in q) for(const r in q[c]) q[c][r]=toBuckets(q[c][r]); return q; }\nconst newSubId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);\nfunction blankEstimate(name){\n  return {id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:name||'Untitled estimate', created:Date.now(), updated:Date.now(),\n    rate:95, markup:15, nsec:1, sections:DEFAULT_SECTIONS(), subs:DEFAULT_SUBS(), heads:{}, q:{}, ov:{}, example:false};\n}\nfunction exampleEstimate(){\n  const e=blankEstimate('Example – warehouse fit-out'); e.example=true; e.nsec=3; e.sections[0]='Ground floor'; e.sections[1]='Level 1'; e.sections[2]='Plant room';\n  const set=(cat,row,arr)=>{ (e.q[cat]=e.q[cat]||{})[row]=arr; };\n  const pick=(id,pred)=>{ const c=CAT[id]; if(!c) return null; const r=c.rows.find(r=>r.length>2&&!r[8]&&pred(r)); return r? r[0]:null; };\n  const pw=pick('power-outlets',r=>/DOUBLE/i.test(r[2])&&r[4]>0); if(pw) set('power-outlets',pw,[24,18,4]);\n  const li=pick('light-fittings',r=>/^F1\\b/.test(r[2])); if(li){ set('light-fittings',li,[40,32,6]); e.ov['light-fittings']={[li]:{p:145}}; }\n  const sw=pick('lighting-switches',r=>/^SWITCH 1GANG/i.test(r[2])); if(sw) set('lighting-switches',sw,[10,8,2]);\n  const cd=pick('conduit',r=>r[4]>0&&/^20mm.*CONDUIT/i.test(r[2])&&!/COMMS/i.test(r[2])); if(cd) set('conduit',cd,[120,90,40]);\n  const sb=pick('switchboards',r=>/medium DB/i.test(r[2])); if(sb){ set('switchboards',sb,[1,1,0]); e.ov['switchboards']={[sb]:{p:6800}}; }\n  migrateQ(e.q);\n  /* example sub-section: a named submain on Level 1 */\n  const subId='sx1'; e.subs[1].push({id:subId,name:'Submain MSB to DB-L1'});\n  e.heads['1.'+subId]=[{id:'h',name:'General items'},{id:'hc',name:'Cable run'},{id:'ht',name:'Terminations'}];\n  const cab=CAT['pvc-swa-pvc-2-3-4c-e']; if(cab){ const its=cab.rows.filter(r=>r.length>2&&!r[8]&&r[4]>0).slice(0,2);\n    if(its[0]) ((e.q[cab.id]=e.q[cab.id]||{})[its[0][0]]={['1.'+subId+'.hc']:45}); if(its[1]) (e.q[cab.id][its[1][0]]={['1.'+subId+'.ht']:2}); }\n  return e;\n}\nlet est = null, dirty=false;\nconst ui = {view:'summary', sec:0, sub:'g', head:'h', closed:new Set(), only:false, search:'', flip:new Set(), defOpen:false, hflip:new Set(), hDefOpen:true};\ntry{ ui.hDefOpen=localStorage.getItem('takeoff-estimator-headings')!=='closed'; }catch(x){}\ntry{ ui.defOpen=localStorage.getItem('takeoff-estimator-linked')==='open'; }catch(x){}\n\nconst curBK=()=>ui.sec+'.'+ui.sub+'.'+ui.head;\nconst headsOf=(s,sub)=>{ const k=s+'.'+sub; return est.heads[k]||(est.heads[k]=[{id:'h',name:'General items'}]); };\nconst headName=(s,sub,id)=>{ const x=headsOf(s,sub).find(z=>z.id===id); return x?x.name:'General items'; };\nconst subsOf=s=>est.subs[s]||(est.subs[s]=[{id:'g',name:'General'}]);\nconst subName=(s,id)=>{ const x=subsOf(s).find(z=>z.id===id); return x?x.name:'General'; };\nfunction qIn(cat,row,bk){ const a=est.q[cat]&&est.q[cat][row]; return a? (+a[bk]||0):0; }\nfunction setQ(cat,row,bk,v){\n  const c=est.q[cat]=est.q[cat]||{}; const a=c[row]=c[row]||{};\n  if(v) a[bk]=v; else delete a[bk];\n  if(!Object.keys(a).length) delete c[row]; if(!Object.keys(c).length) delete est.q[cat];\n  invalidate(cat); touch();\n}\n/* remove every quantity in buckets matching a test */\nfunction clearBuckets(test){ for(const c in est.q){ for(const r in est.q[c]){ const a=est.q[c][r]; for(const bk in a) if(test(bk)) delete a[bk]; if(!Object.keys(a).length) delete est.q[c][r]; } if(!Object.keys(est.q[c]).length) delete est.q[c]; } Object.keys(CACHE).forEach(invalidate); }\nfunction bucketHasQty(test){ for(const c in est.q) for(const r in est.q[c]) for(const bk in est.q[c][r]) if(test(bk)&&+est.q[c][r][bk]) return true; return false; }\nfunction ovr(cat,row){ return (est.ov[cat]&&est.ov[cat][row])||{}; }\nfunction setOv(cat,row,key,v){\n  const c=est.ov[cat]=est.ov[cat]||{}; const o=c[row]=c[row]||{};\n  if(v===null||v===undefined||v==='') delete o[key]; else o[key]=v;\n  if(!Object.keys(o).length) delete c[row]; if(!Object.keys(c).length) delete est.ov[cat];\n  invalidate(cat); touch();\n}\nfunction eff(c,r){ const o=ovr(c.id,r[0]); return {desc:o.d??r[2], p:o.p??r[4], disc:o.disc??r[5], rate:o.r??r[6], k:o.k??r[7]}; }\n\n/* compute one category: per row per section qty, plus totals */\nconst CACHE={};\nfunction invalidate(cat){ delete CACHE[cat]; }\nfunction calc(cat){\n  if(CACHE[cat]) return CACHE[cat];\n  const c=CAT[cat]; const n=est.nsec; const out={rows:{}, bq:{}, bMat:{}, bHrs:{}, mat:0, hrs:0, secMat:new Array(n).fill(0), secHrs:new Array(n).fill(0), lines:0};\n  if(!est.q[cat]){ CACHE[cat]=out; return out; }\n  const bks=new Set(); for(const r in est.q[cat]) for(const bk in est.q[cat][r]) if(+bk.split('.')[0]<n) bks.add(bk);\n  for(const bk of bks){\n    const s=+bk.split('.')[0]; const memo={}, busy={};\n    const Q=row=>{ if(row in memo) return memo[row]; if(busy[row]) return 0; busy[row]=1; const f=fnFor(c,row); const v=f? f(Q,R): qIn(cat,row,bk); memo[row]=isFinite(v)?v:0; busy[row]=0; return memo[row]; };\n    const R=(a,b)=>{ let t=0; for(let k=a;k<=b;k++) if(c.items[k]) t+=Q(k); return t; };\n    for(const r of c.rows){ if(r.length<3) continue; const v=Q(r[0]); if(v){ (out.rows[r[0]]=out.rows[r[0]]||new Array(n).fill(0))[s]+=v; (out.bq[r[0]]=out.bq[r[0]]||{})[bk]=v; } }\n  }\n  for(const row in out.rows){\n    const r=c.items[row], e=eff(c,r), a=out.rows[row];\n    const net=e.p*(1-e.disc), uh=e.rate*e.k; let tq=0;\n    a.forEach((v,s)=>{ tq+=v; out.secMat[s]+=v*net; out.secHrs[s]+=v*uh; });\n    for(const bk in out.bq[row]){ const v=out.bq[row][bk]; out.bMat[bk]=(out.bMat[bk]||0)+v*net; out.bHrs[bk]=(out.bHrs[bk]||0)+v*uh; }\n    out.mat+=tq*net; out.hrs+=tq*uh; if(tq) out.lines++;\n  }\n  CACHE[cat]=out; return out;\n}\nfunction grand(){\n  let mat=0,hrs=0; const n=est.nsec, secMat=new Array(n).fill(0), secHrs=new Array(n).fill(0);\n  for(const id in est.q){ if(!CAT[id]) continue; const o=calc(id); mat+=o.mat; hrs+=o.hrs; o.secMat.forEach((v,i)=>secMat[i]+=v); o.secHrs.forEach((v,i)=>secHrs[i]+=v); }\n  return {mat,hrs,secMat,secHrs};\n}\nconst lab = h=>h*est.rate;\nconst sell = (m,h)=>(m+lab(h))*(1+est.markup/100);\n\n/* ---------- storage: private per-viewer db, falling back to this browser ---------- */\nconst store = {mode:'local', col:null};\nconst LS='takeoff-estimator-v1';\nfunction lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }\nfunction lsSet(v){ try{ localStorage.setItem(LS,JSON.stringify(v)); return true; }catch(e){ return false; } }\nasync function initStore(){\n  try{\n    if(!window.claude||!window.claude.use) return;\n    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);\n    if(!db||!user) return; const uid=await user.id(); if(!uid) return;\n    store.col=db.doc('data/users/'+uid+'/profile').collection('estimates'); store.mode='db';\n  }catch(e){ store.mode='local'; }\n}\nfunction pack(e){ return {id:e.id,name:e.name,created:e.created,updated:e.updated,rate:e.rate,markup:e.markup,nsec:e.nsec,sections:e.sections,subs:JSON.stringify(e.subs),heads:JSON.stringify(e.heads),example:!!e.example,q:JSON.stringify(e.q),ov:JSON.stringify(e.ov)}; }\nfunction unpack(d){ const e=Object.assign(blankEstimate(),d); try{e.q=typeof d.q==='string'?JSON.parse(d.q):(d.q||{});}catch(x){e.q={};} try{e.ov=typeof d.ov==='string'?JSON.parse(d.ov):(d.ov||{});}catch(x){e.ov={};} try{e.subs=typeof d.subs==='string'?JSON.parse(d.subs):(d.subs||DEFAULT_SUBS());}catch(x){e.subs=DEFAULT_SUBS();} while(e.subs.length<MAXSEC) e.subs.push([{id:'g',name:'General'}]); try{e.heads=typeof d.heads==='string'?JSON.parse(d.heads):(d.heads||{});}catch(x){e.heads={};} migrateQ(e.q); return e; }\nasync function listEstimates(){\n  if(store.mode==='db'){ try{ const snap=await store.col.get(); return snap.docs.filter(d=>d.exists).map(d=>d.data()).sort((a,b)=>b.updated-a.updated); }catch(e){ return []; } }\n  const all=lsGet()||{list:{}}; return Object.values(all.list||{}).sort((a,b)=>b.updated-a.updated);\n}\nasync function saveEstimate(e){\n  const p=pack(e);\n  if(store.mode==='db'){ await store.col.doc(e.id).set(p); }\n  else { const all=lsGet()||{list:{}}; all.list=all.list||{}; all.list[e.id]=p; all.last=e.id; if(!lsSet(all)) throw new Error('local'); }\n  try{ localStorage.setItem(LS+'-last',e.id); }catch(x){}\n}\nasync function deleteEstimate(id){\n  if(store.mode==='db'){ await store.col.doc(id).delete(); }\n  else { const all=lsGet()||{list:{}}; delete all.list[id]; lsSet(all); }\n}\nlet saveTimer=null, saving=false;\nfunction touch(){ est.updated=Date.now(); dirty=true; $('#saveState').textContent='Unsaved'; clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200); refreshTotals(); }\nasync function flush(){\n  if(!dirty||saving) return; saving=true; dirty=false; $('#saveState').textContent='Saving…';\n  try{ await saveEstimate(est); $('#saveState').textContent= store.mode==='db'?'Saved':'Saved in this browser'; }\n  catch(e){ dirty=true; $('#saveState').textContent= e&&e.code==='quota_exceeded'?'Storage full':'Not saved'; }\n  saving=false; if(dirty){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,2000); }\n}\n\n/* ---------- rendering ---------- */\nfunction refreshTotals(){\n  const g=grand();\n  $('#tHrs').textContent=fmt(g.hrs,1);\n  $('#tLab').textContent=money0(lab(g.hrs));\n  $('#tMat').textContent=money0(g.mat);\n  $('#tSell').textContent=money0(sell(g.mat,g.hrs));\n  renderRail();\n}\nfunction renderRail(){\n  const groups={}; LIB.forEach(c=>(groups[c.group]=groups[c.group]||[]).push(c));\n  let h='<div class=\"top-links\"><button type=\"button\" data-view=\"summary\" aria-current=\"'+(ui.view==='summary')+'\"><span>Estimate breakup<\/span><\/button>'+\n        '<button type=\"button\" data-view=\"search\" aria-current=\"'+(ui.view==='search')+'\"><span>Search all items<\/span><\/button><\/div>';\n  for(const g in groups){\n    h+='<h4>'+esc(g)+'<\/h4>';\n    for(const c of groups[g]){\n      const o=est.q[c.id]?calc(c.id):null; const v=o&&(o.mat||o.hrs)? money0(sell(o.mat,o.hrs)):'';\n      h+='<button type=\"button\" data-view=\"'+c.id+'\" aria-current=\"'+(ui.view===c.id)+'\"><span>'+esc(c.name)+'<\/span><span class=\"amt\">'+v+'<\/span><\/button>';\n    }\n  }\n  const rail=$('#rail'); const st=rail.scrollTop; rail.innerHTML=h; rail.scrollTop=st;\n  const pick=$('#catPick'); let o='<option value=\"summary\">Estimate breakup<\/option><option value=\"search\">Search all items<\/option>';\n  for(const g in groups){ o+='<optgroup label=\"'+esc(g)+'\">'+groups[g].map(c=>'<option value=\"'+c.id+'\">'+esc(c.name)+'<\/option>').join('')+'<\/optgroup>'; }\n  pick.innerHTML=o; pick.value=ui.view;\n}\nfunction sectionChips(){\n  let h='<div class=\"sections\"><span class=\"lbl\">Section<\/span>';\n  for(let s=0;s<est.nsec;s++) h+='<button type=\"button\" class=\"chip\" data-sec=\"'+s+'\" aria-pressed=\"'+(ui.sec===s)+'\">'+esc(est.sections[s])+'<\/button>';\n  h+='<button type=\"button\" class=\"chip add\" data-act=\"sections\">Edit sections<\/button><\/div>';\n  h+='<div class=\"sections subs\"><span class=\"lbl\">Sub-section<\/span>';\n  for(const x of subsOf(ui.sec)) h+='<button type=\"button\" class=\"chip sub\" data-sub=\"'+x.id+'\" aria-pressed=\"'+(ui.sub===x.id)+'\">'+esc(x.name)+'<\/button>';\n  h+='<button type=\"button\" class=\"chip add\" data-act=\"newsub\">+ New sub-section<\/button>'+(subsOf(ui.sec).length>1?'<button type=\"button\" class=\"chip add\" data-act=\"subs\">Rename / remove<\/button>':'')+'<\/div>';\n  h+='<div class=\"sections subs\"><span class=\"lbl\">Heading<\/span>';\n  for(const x of headsOf(ui.sec,ui.sub)) h+='<button type=\"button\" class=\"chip head\" data-head=\"'+x.id+'\" aria-pressed=\"'+(ui.head===x.id)+'\">'+esc(x.name)+'<\/button>';\n  h+='<button type=\"button\" class=\"chip add\" data-newhead=\"'+ui.sec+'.'+ui.sub+'\">+ New heading<\/button><\/div>';\n  h+='<div class=\"entering\">Quantities you type go to <b>'+esc(est.sections[ui.sec])+'<\/b> › <b>'+esc(subName(ui.sec,ui.sub))+'<\/b> › <b>'+esc(headName(ui.sec,ui.sub,ui.head))+'<\/b>. Total qty is across all sections.<\/div>';\n  return h;\n}\n/* ---------- linked-item groups ---------- */\n/* Each linked line belongs to the nearest item above it in the same block (e.g. a gland and its\n   lock nut, washer, earth tag, shroud, markers). Linked lines with no item above them in their block\n   (tray brackets, splice plates, hardware) form a group of their own. */\n/* the ordinary (non-linked) lines a linked line is calculated from */\nfunction driversOf(c,row){\n  c._d=c._d||{}; if(c._d[row]) return c._d[row];\n  const out=new Set(), seen=new Set();\n  (function walk(rw){ if(seen.has(rw)) return; seen.add(rw); const r=c.items[rw]; if(!r) return;\n    if(!r[8]){ if(rw!==row) out.add(rw); return; }\n    const f=r[8]; let m; const re=/Q\\((\\d+)\\)|R\\((\\d+),(\\d+)\\)/g;\n    while((m=re.exec(f))){ if(m[1]) walk(+m[1]); else for(let k=+m[2];k<=+m[3];k++) if(c.items[k]) walk(k); }\n  })(row);\n  return c._d[row]=[...out].sort((x,y)=>x-y);\n}\n/* Each linked line sits under the item it is calculated from (a gland's lock nut, washer and earth tag;\n   an outlet's wall clip and TPS). Linked lines calculated from items in other blocks (tray brackets,\n   splice plates, hardware) form a stand-alone group in their own block. */\nfunction groupsFor(c){\n  if(c._g) return c._g;\n  const parentOf={}, kids={}, blockOf={}; let blk=0, orphan=null;\n  for(const r of c.rows){ if(r.length<3){ blk++; orphan=null; continue; } blockOf[r[0]]=blk; }\n  blk=0;\n  for(const r of c.rows){\n    if(r.length<3){ blk++; orphan=null; continue; }\n    if(!r[8]) continue;\n    const D=driversOf(c,r[0]);\n    const local= D.length && D.every(d=>blockOf[d]===blk && d<r[0]);\n    const key= local? String(D[0]) : (orphan||(orphan='g'+r[0]));\n    parentOf[r[0]]=key; (kids[key]=kids[key]||[]).push(r[0]);\n  }\n  return c._g={parentOf,kids,blockOf};\n}\n/* quantity of every linked line when one driver item is set to 1 and everything else is 0 */\nconst RATIO={};\nfunction ratioMap(c,driver){\n  const k=c.id+'#'+driver; if(RATIO[k]) return RATIO[k];\n  const memo={}, busy={};\n  const Q=row=>{ if(row===driver) return 1; if(row in memo) return memo[row]; const f=fnFor(c,row); if(!f||busy[row]) return 0; busy[row]=1; const v=f(Q,R); busy[row]=0; return memo[row]=isFinite(v)?v:0; };\n  const R=(a,b)=>{ let t=0; for(let i=a;i<=b;i++) if(c.items[i]) t+=Q(i); return t; };\n  return RATIO[k]=Q;\n}\nfunction ratiosFor(c,parent){ const Q=ratioMap(c,+parent); const out={}; for(const kid of groupsFor(c).kids[String(parent)]||[]) out[kid]=Q(kid); return out; }\nfunction lineTotals(c,row,res){\n  const r=c.items[row], e=eff(c,r), a=res.rows[row]; const tq=a? a.reduce((x,y)=>x+y,0):0; const sq=(res.bq&&res.bq[row]&&res.bq[row][curBK()])||0;\n  const net=e.p*(1-e.disc); return {e,tq,sq,net,mat:tq*net,hrs:tq*e.rate*e.k};\n}\n/* summary of a group: totals for the group, and per-unit figures for one of the parent item */\nfunction groupSummary(c,key,res){\n  const kids=groupsFor(c).kids[key]||[]; const isOrphan=key[0]==='g';\n  let mat=0,hrs=0,kq=0,ksq=0,qtyLines=0;\n  const members= isOrphan? kids : [+key,...kids];\n  for(const row of members){ const t=lineTotals(c,row,res); mat+=t.mat; hrs+=t.hrs; if(row!==+key){ kq+=t.tq; ksq+=t.sq; } if(t.tq) qtyLines++; }\n  const s={mat,hrs,count:kids.length,isOrphan,qtyLines};\n  if(!isOrphan){\n    const p=+key, rt=ratiosFor(c,p); const pe=eff(c,c.items[p]);\n    let gross=pe.p, net=pe.p*(1-pe.disc), hb=pe.rate, hk=pe.rate*pe.k;\n    for(const kid of kids){ const f=rt[kid]||0; if(!f) continue; const e=eff(c,c.items[kid]); gross+=f*e.p; net+=f*e.p*(1-e.disc); hb+=f*e.rate; hk+=f*e.rate*e.k; }\n    Object.assign(s,{unit:gross, disc:gross?1-net/gross:0, hrsUnit:hb, diff:hb?hk/hb:1});\n  } else {\n    Object.assign(s,{tq:kq,sq:ksq});\n  }\n  return s;\n}\nfunction isOpen(cat,key){ const k=cat+'|'+key; return ui.defOpen? !ui.flip.has(k) : ui.flip.has(k); }\n\nfunction rowHtml(c,r,res,opt){\n  opt=opt||{};\n  if(r.length<3) return '<tr class=\"hdr\"><td colspan=\"10\">'+esc(r[1])+'<\/td><\/tr>';\n  const row=r[0], o=ovr(c.id,row); const t=lineTotals(c,row,res), e=t.e; const linked=!!r[8];\n  const gs=opt.group; const collapsed=gs&&!opt.open;\n  const qcell= linked? '<span class=\"auto num\" title=\"Calculated from the item it belongs with\">'+fmt(t.sq,2)+'<\/span>'\n    : '<input class=\"q\" inputmode=\"decimal\" type=\"number\" min=\"0\" step=\"any\" aria-label=\"Quantity, '+esc(est.sections[ui.sec]+' – '+subName(ui.sec,ui.sub)+' – '+headName(ui.sec,ui.sub,ui.head))+'\" id=\"q-'+c.id+'-'+row+'\" data-k=\"q\" data-c=\"'+c.id+'\" data-r=\"'+row+'\" value=\"'+(t.sq?+t.sq.toFixed(4):'')+'\">';\n  const ed=(k,val,lbl,step)=>'<input class=\"e'+(o[k]!==undefined?' changed':'')+'\" type=\"number\" step=\"'+step+'\" aria-label=\"'+lbl+'\" id=\"'+k+'-'+c.id+'-'+row+'\" data-k=\"'+k+'\" data-c=\"'+c.id+'\" data-r=\"'+row+'\" value=\"'+val+'\">';\n  const tog= gs? '<button type=\"button\" class=\"tog\" data-tog=\"'+row+'\" aria-expanded=\"'+!collapsed+'\">'+(collapsed?'▸':'▾')+' '+gs.count+' linked item'+(gs.count===1?'':'s')+(collapsed?'':' · hide')+'<\/button>' : '';\n  const mat= collapsed? gs.mat : t.mat, hrs= collapsed? gs.hrs : t.hrs;\n  const cls='item'+((collapsed? (gs.mat||gs.hrs||t.tq) : t.tq)?' has':'')+(collapsed?' assy':'')+(opt.kid?' kid':'');\n  const S=(v,title)=>'<span class=\"sum num\" title=\"'+title+'\">'+v+'<\/span>';\n  return '<tr class=\"'+cls+'\"><td class=\"code\">'+esc(r[1])+'<\/td>'+\n    '<td class=\"desc\"><input type=\"text\" aria-label=\"Description\" id=\"d-'+c.id+'-'+row+'\" data-k=\"d\" data-c=\"'+c.id+'\" data-r=\"'+row+'\" value=\"'+esc(e.desc)+'\"'+(o.d!==undefined?' style=\"color:var(--copper)\"':'')+'>'+\n      '<div class=\"tags\">'+tog+(linked?'<span class=\"tag link\">linked<\/span>':'')+(r[3]?'<span class=\"tag sup\">'+esc(r[3])+'<\/span>':'')+'<\/div><\/td>'+\n    '<td class=\"r\">'+qcell+'<\/td><td class=\"r num'+(t.tq?'':' dim')+'\">'+fmt(t.tq,2)+'<\/td>'+\n    (collapsed\n      ? '<td class=\"r\">'+S(money(gs.unit),'Per unit, including linked items')+'<\/td>'+\n        '<td class=\"r\">'+S(fmt(gs.disc*100,2),'Blended discount across the group')+'<\/td>'+\n        '<td class=\"r num'+(mat?'':' dim')+'\">'+money(mat)+'<\/td>'+\n        '<td class=\"r\">'+S(fmt(gs.hrsUnit,4),'Install hours per unit, including linked items')+'<\/td>'+\n        '<td class=\"r\">'+S(fmt(gs.diff,2),'Blended difficulty across the group')+'<\/td>'\n      : '<td class=\"r\">'+ed('p',+e.p.toFixed(4),'Unit price','any')+'<\/td>'+\n        '<td class=\"r\">'+ed('disc',+(e.disc*100).toFixed(2),'Discount percent','any')+'<\/td>'+\n        '<td class=\"r num'+(mat?'':' dim')+'\">'+money(mat)+'<\/td>'+\n        '<td class=\"r\">'+ed('r',+e.rate.toFixed(4),'Install hours per unit','any')+'<\/td>'+\n        '<td class=\"r\">'+ed('k',+(+e.k).toFixed(2),'Difficulty factor','0.05')+'<\/td>')+\n    '<td class=\"r num'+(hrs?'':' dim')+'\">'+fmt(hrs,2)+'<\/td><\/tr>';\n}\n/* a group of linked lines that follow lines elsewhere in the sheet (no item directly above them) */\nfunction orphanHtml(c,key,gs,open){\n  const desc=gs.count+' linked item'+(gs.count===1?'':'s')+' (fixings and hardware calculated from the lines above)';\n  return '<tr class=\"item assy orphan'+(gs.mat||gs.hrs?' has':'')+'\"><td class=\"code\"><\/td><td class=\"desc\"><button type=\"button\" class=\"tog\" data-tog=\"'+key+'\" aria-expanded=\"'+open+'\">'+(open?'▾':'▸')+' '+esc(desc)+(open?' · hide':'')+'<\/button><\/td>'+\n    '<td class=\"r\"><span class=\"auto num\">'+fmt(gs.sq,2)+'<\/span><\/td><td class=\"r num'+(gs.tq?'':' dim')+'\">'+fmt(gs.tq,2)+'<\/td>'+\n    '<td class=\"r dim\">—<\/td><td class=\"r dim\">—<\/td><td class=\"r num'+(gs.mat?'':' dim')+'\">'+money(gs.mat)+'<\/td><td class=\"r dim\">—<\/td><td class=\"r dim\">—<\/td>'+\n    '<td class=\"r num'+(gs.hrs?'':' dim')+'\">'+fmt(gs.hrs,2)+'<\/td><\/tr>';\n}\nconst THEAD='<thead><tr><th>Code<\/th><th>Description<\/th><th class=\"r\">Qty (here)<\/th><th class=\"r\">Total qty<\/th><th class=\"r\">Unit $<\/th><th class=\"r\">Disc %<\/th><th class=\"r\">Material $<\/th><th class=\"r\">Hrs / unit<\/th><th class=\"r\">Difficulty<\/th><th class=\"r\">Labour hrs<\/th><\/tr><\/thead>';\n/* ---------- grey section headings: collapsible blocks ---------- */\n/* A heading runs to the next heading. A heading followed straight away by another heading\n   (e.g. \"0.5mm Overall Screened\" then \"1 pair\") is a parent heading: it runs to the next parent heading. */\nfunction blocksFor(c){\n  if(c._h) return c._h;\n  const rows=c.rows, H={}, idx=[];\n  rows.forEach((r,i)=>{ if(r.length<3) idx.push(i); });\n  const isSuper=i=>i+1<rows.length && rows[i+1].length<3;\n  idx.forEach((i,n)=>{ const nextH=n+1<idx.length?idx[n+1]:rows.length; H[i]={sup:isSuper(i),end:nextH}; });\n  idx.forEach(i=>{ if(H[i].sup){ let e=rows.length; for(const j of idx) if(j>i&&H[j].sup){ e=j; break; } H[i].end=e; } });\n  return c._h=H;\n}\nfunction spanSummary(c,res,i,j){\n  let mat=0,hrs=0,base=0,gross=0,lines=0;\n  for(let k=i;k<j;k++){ const r=c.rows[k]; if(r.length<3) continue; const t=lineTotals(c,r[0],res); if(!t.tq) continue;\n    lines++; mat+=t.mat; hrs+=t.hrs; base+=t.tq*t.e.rate; gross+=t.tq*t.e.p; }\n  return {mat,hrs,lines,disc:gross?1-mat/gross:0,diff:base?hrs/base:1};\n}\nfunction isHOpen(cat,row){ const k=cat+'|h'+row; return ui.hDefOpen? !ui.hflip.has(k) : ui.hflip.has(k); }\nfunction hdrHtml(c,r,info,sm,open){\n  const lab= sm.lines? sm.lines+' line'+(sm.lines===1?'':'s') : 'no qty';\n  const dim=open?' hmuted':'';\n  return '<tr class=\"hdr'+(info.sup?' sup':'')+(open?'':' shut')+(sm.lines?' has':'')+'\"><td colspan=\"2\"><button type=\"button\" class=\"htog\" data-htog=\"'+r[0]+'\" aria-expanded=\"'+open+'\"><span class=\"chev\">'+(open?'▾':'▸')+'<\/span>'+esc(r[1])+'<\/button><\/td>'+\n    '<td><\/td><td class=\"r hs'+dim+'\">'+lab+'<\/td><td class=\"r hs'+dim+'\">—<\/td>'+\n    '<td class=\"r hs num'+dim+'\">'+(sm.lines?fmt(sm.disc*100,2):'')+'<\/td>'+\n    '<td class=\"r hs num'+dim+'\">'+(sm.lines?money(sm.mat):'')+'<\/td><td class=\"r hs'+dim+'\">—<\/td>'+\n    '<td class=\"r hs num'+dim+'\">'+(sm.lines?fmt(sm.diff,2):'')+'<\/td>'+\n    '<td class=\"r hs num'+dim+'\">'+(sm.lines?fmt(sm.hrs,2):'')+'<\/td><\/tr>';\n}\nfunction renderCategory(){\n  const c=CAT[ui.view]; const res=calc(c.id); const G=groupsFor(c); const H=blocksFor(c);\n  const s=ui.search.trim().toLowerCase(); const filtering=!!(s||ui.only);\n  const match=row=>{ const r=c.items[row]; return (!s||(eff(c,r).desc+' '+r[1]).toLowerCase().includes(s)) && (!ui.only||res.rows[row]); };\n  const out=[]; let pend=[]; const done=new Set();\n  const flushP=()=>{ out.push(...pend); pend=[]; };\n  const emit=h=>{ if(pend.length) flushP(); out.push(h); };\n  const rows=c.rows;\n  for(let i=0;i<rows.length;i++){\n    const r=rows[i];\n    if(r.length<3){\n      const info=H[i]; const sm=spanSummary(c,res,i+1,info.end); const open= s? true : isHOpen(c.id,r[0]);\n      if(ui.only&&!sm.lines){ i=info.end-1; continue; }\n      const h=hdrHtml(c,r,info,sm,open);\n      if(info.sup){ pend=[h]; pend.sup=true; } else { pend= pend.sup? [pend[0],h] : [h]; pend.sup= pend.length===2; }\n      if(!open){ flushP(); i=info.end-1; }\n      else if(!filtering) flushP();\n      continue;\n    }\n    const row=r[0]; if(done.has(row)) continue;\n    const key=G.parentOf[row];\n    if(key && key[0]!=='g') continue;            // shown with its parent item\n    if(key){                                       // first line of a stand-alone linked group\n      const kids=G.kids[key]; kids.forEach(k=>done.add(k));\n      const gs=groupSummary(c,key,res); const open=isOpen(c.id,key);\n      const hits=kids.filter(match);\n      if(filtering && !hits.length && !(ui.only&&!s&&(gs.mat||gs.hrs))) continue;\n      emit(orphanHtml(c,key,gs,open||(!!s&&hits.length>0)));\n      if(open||s) (s?hits:kids).forEach(k=>out.push(rowHtml(c,c.items[k],res,{kid:true})));\n      continue;\n    }\n    const kids=G.kids[String(row)];\n    if(kids){\n      const gs=groupSummary(c,String(row),res); const open=isOpen(c.id,String(row));\n      const kidHits= s? kids.filter(match):[];\n      const show= !filtering || match(row) || kidHits.length || (ui.only&&!s&&(gs.mat||gs.hrs));\n      if(!show) continue;\n      const exp= open || kidHits.length>0;\n      emit(rowHtml(c,r,res,{group:gs,open:exp}));\n      if(exp) (kidHits.length&&!open? kidHits : kids).forEach(k=>out.push(rowHtml(c,c.items[k],res,{kid:true})));\n      continue;\n    }\n    if(!filtering||match(row)) emit(rowHtml(c,r,res));\n  }\n  const body=out.length? out.join('') : '<tr><td colspan=\"10\" class=\"empty\">'+(ui.only&&!s?'No quantities entered in this category yet.':'No items match “'+esc(ui.search)+'”.')+'<\/td><\/tr>';\n  $('#main').innerHTML=\n    '<div class=\"sheet-head\"><div><div class=\"crumb\">'+esc(c.group)+'<\/div><h1>'+esc(c.name)+'<\/h1><\/div>'+\n    '<div class=\"tools\"><input type=\"search\" id=\"fSearch\" placeholder=\"Filter this sheet\" value=\"'+esc(ui.search)+'\" aria-label=\"Filter items\">'+\n    '<label class=\"chk\"><input type=\"checkbox\" id=\"fOnly\"'+(ui.only?' checked':'')+'> Only lines with qty<\/label>'+\n    '<\/div><\/div><div class=\"tools\" style=\"margin-top:10px\"><span class=\"chk\">Headings<\/span><button type=\"button\" class=\"btn\" data-act=\"hexpand\">Expand all<\/button><button type=\"button\" class=\"btn\" data-act=\"hcollapse\">Collapse all<\/button><span class=\"chk\" style=\"margin-left:8px\">Linked items<\/span><button type=\"button\" class=\"btn\" data-act=\"expand\">Expand<\/button><button type=\"button\" class=\"btn\" data-act=\"collapse\">Collapse<\/button><\/div>'+\n    sectionChips()+\n    '<div class=\"tblwrap\"><table><colgroup><col style=\"width:84px\"><col><col style=\"width:100px\"><col style=\"width:84px\"><col style=\"width:96px\"><col style=\"width:80px\"><col style=\"width:110px\"><col style=\"width:84px\"><col style=\"width:80px\"><col style=\"width:90px\"><\/colgroup>'+THEAD+'<tbody>'+body+'<\/tbody>'+\n    '<tfoot><tr class=\"foot\"><td><\/td><td>Sheet total<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class=\"r num\" id=\"fMat\">'+money(res.mat)+'<\/td><td><\/td><td><\/td><td class=\"r num\" id=\"fHrs\">'+fmt(res.hrs,2)+'<\/td><\/tr><\/tfoot><\/table><\/div>'+\n    '<p class=\"note\" style=\"margin-top:10px\">Linked items (lock nuts, washers, earth tags, markers, fixings) follow the item they belong to, as in the original take-off sheets. While a group is collapsed, its row shows the whole group: <b>Unit $<\/b> and <b>Hrs / unit<\/b> are per one of the item including its linked items, <b>Disc %<\/b> and <b>Difficulty<\/b> are blended across the group, and <b>Material $<\/b> and <b>Labour hrs<\/b> are group totals. Expand a group to edit the linked lines or the item’s own price and rate.<\/p>';\n}\nfunction renderSearch(){\n  const s=ui.search.trim().toLowerCase(); let h='', count=0;\n  if(s.length>=2){\n    for(const c of LIB){ const res=est.q[c.id]?calc(c.id):{rows:{}}; let block='';\n      for(const r of c.rows){ if(r.length<3) continue; const e=eff(c,r); if((e.desc+' '+r[1]).toLowerCase().includes(s)){ if(count<300) block+=rowHtml(c,r,res); count++; } }\n      if(block) h+='<tr class=\"hdr\"><td colspan=\"10\">'+esc(c.name)+'<\/td><\/tr>'+block;\n    }\n  }\n  $('#main').innerHTML='<div class=\"sheet-head\"><div><div class=\"crumb\">All '+LIB.length+' sheets<\/div><h1>Search all items<\/h1><\/div>'+\n    '<div class=\"tools\"><input type=\"search\" id=\"fSearch\" placeholder=\"e.g. 20mm gland, GPO, 25mm conduit\" value=\"'+esc(ui.search)+'\" aria-label=\"Search all items\"><\/div><\/div>'+sectionChips()+\n    (s.length<2? '<p class=\"note\">Type at least two characters to search the '+LIB.reduce((a,c)=>a+Object.keys(c.items).length,0).toLocaleString()+' library items.<\/p>'\n     : count? '<div class=\"tblwrap\"><table>'+THEAD+'<tbody>'+h+'<\/tbody><\/table><\/div>'+(count>300?'<p class=\"note\">Showing the first 300 of '+count+' matches. Narrow the search to see more.<\/p>':'')\n     : '<p class=\"note\">No items match “'+esc(ui.search)+'”.<\/p>');\n}\n/* the items chosen in one bucket (section + sub-section); linked lines roll into the item they belong to */\nfunction bucketItems(bk){\n  const out=[];\n  for(const c of LIB){ if(!est.q[c.id]) continue; const res=calc(c.id); const G=groupsFor(c); const ent={}; const order=[];\n    const qb=row=>(res.bq[row]&&res.bq[row][bk])||0;\n    const get=(k,init)=>{ if(!ent[k]){ ent[k]=init(); order.push(k); } return ent[k]; };\n    const itemEnt=row=>get(String(row),()=>{ const r=c.items[row]; return {cat:c,row,code:r[1],desc:eff(c,r).desc,qty:qb(row),mat:0,hrs:0,linked:0}; });\n    let hdr='';\n    for(const r of c.rows){ if(r.length<3){ hdr=r[1]; continue; } const row=r[0]; const v=qb(row); if(!v) continue;\n      const e=eff(c,r); const mat=v*e.p*(1-e.disc), hrs=v*e.rate*e.k;\n      if(!r[8]){ const x=itemEnt(row); x.mat+=mat; x.hrs+=hrs; continue; }\n      const D=driversOf(c,row); const w=D.map(d=>ratioMap(c,d)(row)*qb(d)); const W=w.reduce((a,b)=>a+b,0);\n      if(W>0){ D.forEach((d,i)=>{ if(!w[i]) return; const x=itemEnt(d); x.mat+=mat*w[i]/W; x.hrs+=hrs*w[i]/W; x.linked++; }); }\n      else { const key=G.parentOf[row]||('g'+row); const x=get('o'+key,()=>({cat:c,code:'',desc:'Fixings and hardware'+(hdr?' – '+hdr:''),qty:null,mat:0,hrs:0,linked:0})); x.mat+=mat; x.hrs+=hrs; x.linked++; }\n    }\n    for(const k of order) out.push(ent[k]);\n  }\n  return out;\n}\nfunction bucketTotals(bk){ let mat=0,hrs=0; for(const id in est.q){ if(!CAT[id]) continue; const o=calc(id); mat+=o.bMat[bk]||0; hrs+=o.bHrs[bk]||0; } return {mat,hrs}; }\nfunction prefixTotals(pre){ let mat=0,hrs=0; for(const id in est.q){ if(!CAT[id]) continue; const o=calc(id); for(const bk in o.bMat) if(bk.startsWith(pre)){ mat+=o.bMat[bk]; hrs+=o.bHrs[bk]; } } return {mat,hrs}; }\nconst figs=(n,word,tt)=>'<span class=\"sfig\">'+(n===null?'':'<span>'+n+' '+word+(n===1?'':'s')+'<\/span>')+'<span>Material <b class=\"num\">'+money0(tt.mat)+'<\/b><\/span><span>Labour <b class=\"num\">'+fmt(tt.hrs,1)+' h<\/b><\/span><span>Sell <b class=\"num\">'+money0(sell(tt.mat,tt.hrs))+'<\/b><\/span><\/span>';\nfunction itemsTable(bk,items,tt,label){\n  if(!items.length) return '<p class=\"note\">No items under this heading yet. Click “Choose items” to pick from the library.<\/p>';\n  return '<div class=\"tblwrap\"><table style=\"min-width:760px\"><thead><tr><th>Sheet<\/th><th>Item<\/th><th class=\"r\">Qty<\/th><th class=\"r\">Material $<\/th><th class=\"r\">Labour hrs<\/th><th class=\"r\">Sell $<\/th><th><\/th><\/tr><\/thead><tbody>'+\n    items.map(it=>{ const qc= it.row===undefined? '—' : '<input class=\"q\" type=\"number\" min=\"0\" step=\"any\" inputmode=\"decimal\" aria-label=\"Quantity\" id=\"sq-'+it.cat.id+'-'+it.row+'-'+bk+'\" data-sq=\"'+it.cat.id+'|'+it.row+'|'+bk+'\" value=\"'+(+(+it.qty).toFixed(4)||'')+'\">';\n      return '<tr class=\"item\"><td class=\"dim\" style=\"white-space:nowrap\">'+esc(it.cat.name)+'<\/td><td>'+esc(it.desc)+(it.linked?'<span class=\"tag link\">+'+it.linked+' linked<\/span>':'')+'<\/td><td class=\"r\">'+qc+'<\/td><td class=\"r num\">'+money(it.mat)+'<\/td><td class=\"r num\">'+fmt(it.hrs,2)+'<\/td><td class=\"r num\">'+money(sell(it.mat,it.hrs))+'<\/td>'+\n      '<td class=\"r\">'+(it.row===undefined?'':'<button type=\"button\" class=\"btn ghost xbtn\" aria-label=\"Remove '+esc(it.desc)+'\" data-rm=\"'+it.cat.id+'|'+it.row+'|'+bk+'\">Remove<\/button>')+'<\/td><\/tr>'; }).join('')+\n    '<\/tbody><tfoot><tr class=\"foot\"><td><\/td><td>'+esc(label)+' total<\/td><td><\/td><td class=\"r num\">'+money(tt.mat)+'<\/td><td class=\"r num\">'+fmt(tt.hrs,2)+'<\/td><td class=\"r num\">'+money(sell(tt.mat,tt.hrs))+'<\/td><td><\/td><\/tr><\/tfoot><\/table><\/div>';\n}\nfunction sectionSummaries(){\n  let h='<h2 class=\"sub\">Section summaries<\/h2><p class=\"note\" style=\"margin-top:-2px\">Section › sub-section › your own headings. Choose items straight into a heading, or select the heading on any sheet and type quantities there. Linked items are included in the item they belong to.<\/p>';\n  for(let s=0;s<est.nsec;s++){\n    const subs=subsOf(s); const sm=bucketTotalsSection(s); const sk='s'+s;\n    h+='<details class=\"secsum\" data-dk=\"'+sk+'\"'+(ui.closed.has(sk)?'':' open')+'><summary><span class=\"sname\">'+esc(est.sections[s])+'<\/span>'+figs(subs.length,'sub-section',sm)+'<\/summary><div class=\"subwrap\">';\n    for(const x of subs){\n      const sb=s+'.'+x.id; const heads=headsOf(s,x.id); const st=prefixTotals(sb+'.'); const dk='b'+sb;\n      if(x.id==='g'&&!(st.mat||st.hrs)&&subs.length>1&&heads.length<2) continue;\n      h+='<details class=\"subsum\" data-dk=\"'+dk+'\"'+(ui.closed.has(dk)?'':' open')+'><summary><span class=\"sname\">'+esc(x.name)+'<\/span>'+figs(heads.length,'heading',st)+'<\/summary><div class=\"subbody\">';\n      for(const hd of heads){\n        const bk=sb+'.'+hd.id; const items=bucketItems(bk); const tt=bucketTotals(bk); const hk='h'+bk;\n        if(hd.id==='h'&&!items.length&&heads.length>1) continue;\n        h+='<details class=\"headsum\" data-dk=\"'+hk+'\"'+(ui.closed.has(hk)?'':' open')+'><summary><span class=\"sname\">'+esc(hd.name)+'<\/span>'+figs(items.length,'item',tt)+'<\/summary><div class=\"headbody\">'+\n          '<div class=\"subtools\"><button type=\"button\" class=\"btn primary\" data-pick=\"'+bk+'\">Choose items<\/button><button type=\"button\" class=\"btn\" data-renhead=\"'+bk+'\">Rename heading<\/button>'+(hd.id==='h'?'':'<button type=\"button\" class=\"btn ghost\" data-delhead=\"'+bk+'\">Remove heading<\/button>')+'<\/div>'+\n          itemsTable(bk,items,tt,hd.name)+'<\/div><\/details>';\n      }\n      h+='<div class=\"subtools\"><button type=\"button\" class=\"btn\" data-newhead=\"'+sb+'\">+ New heading in '+esc(x.name)+'<\/button><\/div><\/div><\/details>';\n    }\n    h+='<div class=\"subtools\" style=\"margin:8px 0 4px\"><button type=\"button\" class=\"btn\" data-newsubfor=\"'+s+'\">+ New sub-section in '+esc(est.sections[s])+'<\/button><\/div><\/div><\/details>';\n  }\n  return h;\n}\nfunction bucketTotalsSection(s){ let mat=0,hrs=0; for(const id in est.q){ if(!CAT[id]) continue; const o=calc(id); mat+=o.secMat[s]||0; hrs+=o.secHrs[s]||0; } return {mat,hrs}; }\nfunction renderSummary(){\n  const g=grand(); const total=sell(g.mat,g.hrs);\n  let cards='';\n  for(let s=0;s<est.nsec;s++){ const v=sell(g.secMat[s],g.secHrs[s]);\n    cards+='<div class=\"card\"><h3>'+esc(est.sections[s])+'<\/h3><div class=\"row\"><span>Sell<\/span><b class=\"num\">'+money0(v)+'<\/b><\/div><div class=\"row\"><span>Material<\/span><b class=\"num\">'+money0(g.secMat[s])+'<\/b><\/div><div class=\"row\"><span>Labour<\/span><b class=\"num\">'+fmt(g.secHrs[s],1)+' h<\/b><\/div><div class=\"bar-mini\"><span style=\"width:'+(total?Math.max(0,v/total*100):0).toFixed(1)+'%\"><\/span><\/div><\/div>'; }\n  const used=LIB.filter(c=>est.q[c.id]&&(calc(c.id).mat||calc(c.id).hrs));\n  let th='<tr><th>Category<\/th>'+Array.from({length:est.nsec},(_,s)=>'<th class=\"r\">'+esc(est.sections[s])+'<\/th>').join('')+'<th class=\"r\">Material $<\/th><th class=\"r\">Labour hrs<\/th><th class=\"r\">Labour $<\/th><th class=\"r\">Sell $<\/th><\/tr>';\n  let tb=used.map(c=>{ const o=calc(c.id); return '<tr class=\"item\"><td><button type=\"button\" class=\"btn ghost\" style=\"padding:0;color:var(--fg)\" data-view=\"'+c.id+'\">'+esc(c.name)+'<\/button><\/td>'+o.secMat.map((m,s)=>'<td class=\"r num\">'+money0(sell(m,o.secHrs[s]))+'<\/td>').join('')+'<td class=\"r num\">'+money0(o.mat)+'<\/td><td class=\"r num\">'+fmt(o.hrs,1)+'<\/td><td class=\"r num\">'+money0(lab(o.hrs))+'<\/td><td class=\"r num\"><b>'+money0(sell(o.mat,o.hrs))+'<\/b><\/td><\/tr>'; }).join('');\n  const foot='<tr class=\"foot\"><td>Total<\/td>'+g.secMat.map((m,s)=>'<td class=\"r num\">'+money0(sell(m,g.secHrs[s]))+'<\/td>').join('')+'<td class=\"r num\">'+money0(g.mat)+'<\/td><td class=\"r num\">'+fmt(g.hrs,1)+'<\/td><td class=\"r num\">'+money0(lab(g.hrs))+'<\/td><td class=\"r num\">'+money0(total)+'<\/td><\/tr>';\n  $('#main').innerHTML='<div class=\"sheet-head\"><div><div class=\"crumb\">'+esc(est.name)+'<\/div><h1>Estimate breakup<\/h1><\/div><div class=\"tools\"><button type=\"button\" class=\"btn\" data-act=\"sections\">Edit sections<\/button><\/div><\/div>'+\n    (est.example?'<div class=\"example-flag\">This is an example estimate with sample quantities. Start your own with New.<\/div>':'')+\n    '<div class=\"cards\">'+cards+'<\/div>'+sectionSummaries()+\n    '<h2 class=\"sub\">By category and section (sell price)<\/h2>'+\n    (used.length? '<div class=\"tblwrap\"><table style=\"min-width:'+(560+est.nsec*110)+'px\"><thead>'+th+'<\/thead><tbody>'+tb+'<\/tbody><tfoot>'+foot+'<\/tfoot><\/table><\/div>'\n      : '<div class=\"tblwrap\"><p class=\"empty\">No quantities yet. Pick a sheet on the left, choose the section you are measuring, and type quantities into the Qty column.<\/p><\/div>')+\n    '<p class=\"note\" style=\"margin-top:12px\">Sell price = (material + labour hours × labour rate) × (1 + margin). Material uses the discounted unit price; labour hours = qty × hours per unit × difficulty.<\/p>';\n}\nfunction render(){\n  if(ui.view==='summary') renderSummary(); else if(ui.view==='search') renderSearch(); else renderCategory();\n  $('#estName').value=est.name; $('#rate').value=est.rate; $('#markup').value=est.markup;\n  refreshTotals();\n}\nfunction go(view){ ui.view=view; if(view!=='search') ui.search=''; render(); window.scrollTo(0,0); }\n\n/* re-render after an edit, keeping the cursor where it was */\nfunction rerender(inp){\n  const id=inp.id, raw=inp.value, sel=(inp.type==='text')?inp.selectionStart:null, sx=window.scrollX, sy=window.scrollY;\n  const tw=document.querySelector('.tblwrap'), tsx=tw?tw.scrollLeft:0;\n  render();\n  const tw2=document.querySelector('.tblwrap'); if(tw2) tw2.scrollLeft=tsx; window.scrollTo(sx,sy);\n  const n=document.getElementById(id); if(n){ n.value=raw; n.focus({preventScroll:true}); if(sel!==null) try{n.setSelectionRange(sel,sel);}catch(x){} }\n}\n\nfunction keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(window.scrollX,y); }\n/* ---------- events ---------- */\ndocument.addEventListener('click',e=>{\n  const v=e.target.closest('[data-view]'); if(v){ go(v.dataset.view); return; }\n  const sc=e.target.closest('[data-sec]'); if(sc){ ui.sec=+sc.dataset.sec; ui.sub='g'; keepScroll(render); return; }\n  const sb=e.target.closest('[data-sub]'); if(sb){ ui.sub=sb.dataset.sub; ui.head='h'; keepScroll(render); return; }\n  const hb=e.target.closest('[data-head]'); if(hb){ ui.head=hb.dataset.head; keepScroll(render); return; }\n  const nh=e.target.closest('[data-newhead]'); if(nh){ const p=nh.dataset.newhead.split('.'); openNewHead(+p[0],p[1]); return; }\n  const rh=e.target.closest('[data-renhead]'); if(rh){ const p=rh.dataset.renhead.split('.'); openRenameHead(+p[0],p[1],p[2]); return; }\n  const dh=e.target.closest('[data-delhead]'); if(dh){ const bk=dh.dataset.delhead; const p=bk.split('.');\n    if(bucketHasQty(k=>k===bk)&&!dh.dataset.sure){ dh.dataset.sure=1; dh.textContent='Click again to remove it and its items'; return; }\n    clearBuckets(k=>k===bk); const k2=p[0]+'.'+p[1]; est.heads[k2]=headsOf(+p[0],p[1]).filter(x=>x.id!==p[2]); if(ui.head===p[2]) ui.head='h'; touch(); keepScroll(render); toast('Heading removed'); return; }\n  const pk=e.target.closest('[data-pick]'); if(pk){ openPicker(pk.dataset.pick); return; }\n  const rm=e.target.closest('[data-rm]'); if(rm){ const p=rm.dataset.rm.split('|'); setQ(p[0],+p[1],p[2],0); keepScroll(render); return; }\n  const ad=e.target.closest('[data-additems]'); if(ad){ const p=ad.dataset.additems.split('.'); ui.sec=+p[0]; ui.sub=p[1]; ui.head=p[2]||'h'; go('search'); setTimeout(()=>{ const f=$('#fSearch'); f&&f.focus(); },0); return; }\n  const ns=e.target.closest('[data-act=\"newsub\"]'); if(ns){ openNewSub(); return; }\n  const nf=e.target.closest('[data-newsubfor]'); if(nf){ ui.sec=+nf.dataset.newsubfor; openNewSub(); return; }\n  const ms=e.target.closest('[data-act=\"subs\"]'); if(ms){ openSubs(); return; }\n  const ht=e.target.closest('[data-htog]'); if(ht){ const k=ui.view+'|h'+ht.dataset.htog; ui.hflip.has(k)?ui.hflip.delete(k):ui.hflip.add(k); keepScroll(renderCategory); return; }\n  const ha=e.target.closest('[data-act=\"hexpand\"],[data-act=\"hcollapse\"]'); if(ha){ ui.hDefOpen=ha.dataset.act==='hexpand'; ui.hflip.clear(); try{localStorage.setItem('takeoff-estimator-headings',ui.hDefOpen?'open':'closed');}catch(x){} keepScroll(renderCategory); return; }\n  const tg=e.target.closest('[data-tog]'); if(tg){ const k=ui.view+'|'+tg.dataset.tog; ui.flip.has(k)?ui.flip.delete(k):ui.flip.add(k); keepScroll(renderCategory); return; }\n  const a=e.target.closest('[data-act]'); if(a&&a.dataset.act==='sections'){ openSections(); return; }\n  if(a&&(a.dataset.act==='expand'||a.dataset.act==='collapse')){ ui.defOpen=a.dataset.act==='expand'; ui.flip.clear(); try{localStorage.setItem('takeoff-estimator-linked',ui.defOpen?'open':'closed');}catch(x){} keepScroll(renderCategory); return; }\n});\n$('#catPick').addEventListener('change',e=>go(e.target.value));\ndocument.addEventListener('toggle',e=>{ const d=e.target; if(!d.dataset||!d.dataset.dk) return; d.open? ui.closed.delete(d.dataset.dk) : ui.closed.add(d.dataset.dk); },true);\ndocument.addEventListener('input',e=>{\n  const t=e.target;\n  if(t.id==='fSearch'){ ui.search=t.value; const pos=t.selectionStart; render(); const n=$('#fSearch'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} return; }\n  if(t.id==='fOnly'){ ui.only=t.checked; render(); return; }\n  if(t.id==='estName'){ est.name=t.value||'Untitled estimate'; touch(); return; }\n  if(t.id==='rate'){ est.rate=Math.max(0,+t.value||0); Object.keys(CACHE).forEach(invalidate); touch(); if(ui.view==='summary') renderSummary(); return; }\n  if(t.id==='markup'){ est.markup=+t.value||0; touch(); if(ui.view==='summary') renderSummary(); return; }\n  if(t.dataset.sq){ const p=t.dataset.sq.split('|'); setQ(p[0],+p[1],p[2],Math.max(0,parseFloat(t.value)||0)); if(t.value!==''&&+t.value>0) rerender(t); else { clearTimeout(t._tm); t._tm=setTimeout(()=>rerender(t),900); } return; }\n  const k=t.dataset.k; if(!k) return; const cat=t.dataset.c, row=+t.dataset.r; const r=CAT[cat].items[row];\n  if(k==='q'){ setQ(cat,row,curBK(),Math.max(0,parseFloat(t.value)||0)); }\n  else if(k==='d'){ setOv(cat,row,'d', t.value===r[2]?null:t.value); return; }\n  else { if(t.value==='') { setOv(cat,row,k,null); } else { let v=parseFloat(t.value); if(!isFinite(v)) return; if(k==='disc') v=v/100;\n      const base={p:r[4],disc:r[5],r:r[6],k:r[7]}[k]; setOv(cat,row,k, Math.abs(v-base)<1e-9?null:v); } }\n  rerender(t);\n});\n\n/* ---------- dialogs ---------- */\nfunction toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }\nfunction dialog(html,wire){ const L=$('#layer'); L.innerHTML='<div class=\"overlay\" id=\"ov\"><div class=\"dlg\" role=\"dialog\" aria-modal=\"true\">'+html+'<\/div><\/div>';\n  const close=()=>{L.innerHTML='';}; $('#ov').addEventListener('click',e=>{ if(e.target.id==='ov'||e.target.closest('[data-close]')) close(); });\n  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k);} });\n  wire&&wire(close); }\nfunction openSections(){\n  let h='<h3>Sections<\/h3><p class=\"note\">Split the take-off by area, level or stage, just like the SECT1–SECT20 columns of the original workbook. Up to 20 sections.<\/p><div class=\"secgrid\">';\n  for(let s=0;s<est.nsec;s++) h+='<input id=\"sec-'+s+'\" value=\"'+esc(est.sections[s])+'\" aria-label=\"Section '+(s+1)+' name\">';\n  h+='<\/div><div class=\"actions\"><button class=\"btn\" id=\"secRemove\" type=\"button\"'+(est.nsec<2?' disabled':'')+'>Remove last<\/button><button class=\"btn\" id=\"secAdd\" type=\"button\"'+(est.nsec>=MAXSEC?' disabled':'')+'>Add section<\/button><button class=\"btn primary\" data-close type=\"button\">Done<\/button><\/div><p class=\"note\" id=\"secWarn\"><\/p>';\n  dialog(h,close=>{\n    document.querySelectorAll('.secgrid input').forEach(inp=>inp.addEventListener('input',()=>{ est.sections[+inp.id.slice(4)]=inp.value||('Section '+(+inp.id.slice(4)+1)); touch(); render(); }));\n    $('#secAdd').onclick=()=>{ est.nsec=Math.min(MAXSEC,est.nsec+1); Object.keys(CACHE).forEach(invalidate); touch(); render(); openSections(); };\n    $('#secRemove').onclick=()=>{ const s=est.nsec-1; const has=bucketHasQty(bk=>bk.startsWith(s+'.'));\n      if(has&&!$('#secRemove').dataset.sure){ $('#secRemove').dataset.sure=1; $('#secRemove').textContent='Remove and clear its quantities'; $('#secWarn').textContent='“'+est.sections[s]+'” has quantities. Click again to remove it and clear them.'; return; }\n      clearBuckets(bk=>bk.startsWith(s+'.')); est.subs[s]=[{id:'g',name:'General'}]; for(const k in est.heads) if(k.startsWith(s+'.')) delete est.heads[k];\n      est.nsec=Math.max(1,s); if(ui.sec>=est.nsec){ ui.sec=0; ui.sub='g'; } Object.keys(CACHE).forEach(invalidate); touch(); render(); openSections(); };\n  });\n}\nfunction openNewSub(){\n  dialog('<h3>New sub-section in '+esc(est.sections[ui.sec])+'<\/h3><p class=\"note\">Name it after what it covers, for example a submain, a DB, a riser or a plant item. While it is selected, quantities you enter on any sheet go into it.<\/p>'+\n    '<form id=\"nsForm\"><input id=\"nsName\" type=\"text\" maxlength=\"80\" placeholder=\"e.g. Submain MSB to DB-G1\" style=\"width:100%;padding:8px;border:1px solid var(--line-2);border-radius:4px;background:var(--bg)\" autocomplete=\"off\">'+\n    '<div class=\"actions\"><button class=\"btn\" data-close type=\"button\">Cancel<\/button><button class=\"btn primary\" type=\"submit\">Create<\/button><\/div><\/form>',close=>{\n    const f=$('#nsName'); f.focus();\n    $('#nsForm').addEventListener('submit',ev=>{ ev.preventDefault(); const name=f.value.trim(); if(!name){ f.focus(); f.placeholder='Type a name first'; return; }\n      const id=newSubId(); subsOf(ui.sec).push({id,name}); ui.sub=id; ui.head='h'; touch(); close(); keepScroll(render); toast('“'+name+'” created and selected'); });\n  });\n}\nfunction openNewHead(s,sub){\n  dialog('<h3>New heading in '+esc(subName(s,sub))+'<\/h3><p class=\"note\">Group items under a name of your own, for example “Cable run”, “Terminations” or “Supports and fixings”.<\/p>'+\n    '<form id=\"nhForm\"><input id=\"nhName\" type=\"text\" maxlength=\"80\" placeholder=\"Heading name\" style=\"width:100%;padding:8px;border:1px solid var(--line-2);border-radius:4px;background:var(--bg)\" autocomplete=\"off\">'+\n    '<div class=\"actions\"><button class=\"btn\" data-close type=\"button\">Cancel<\/button><button class=\"btn primary\" type=\"submit\">Create<\/button><\/div><\/form>',close=>{\n    const f=$('#nhName'); f.focus();\n    $('#nhForm').addEventListener('submit',ev=>{ ev.preventDefault(); const name=f.value.trim(); if(!name){ f.focus(); f.placeholder='Type a name first'; return; }\n      const id='h'+Date.now().toString(36)+Math.random().toString(36).slice(2,4); headsOf(s,sub).push({id,name});\n      if(ui.sec===s&&ui.sub===sub) ui.head=id; touch(); close(); keepScroll(render); toast('Heading “'+name+'” created'); });\n  });\n}\nfunction openRenameHead(s,sub,id){\n  const x=headsOf(s,sub).find(z=>z.id===id); if(!x) return;\n  dialog('<h3>Rename heading<\/h3><form id=\"rhForm\"><input id=\"rhName\" type=\"text\" maxlength=\"80\" value=\"'+esc(x.name)+'\" style=\"width:100%;padding:8px;border:1px solid var(--line-2);border-radius:4px;background:var(--bg)\" autocomplete=\"off\">'+\n    '<div class=\"actions\"><button class=\"btn\" data-close type=\"button\">Cancel<\/button><button class=\"btn primary\" type=\"submit\">Save<\/button><\/div><\/form>',close=>{\n    const f=$('#rhName'); f.focus(); f.select();\n    $('#rhForm').addEventListener('submit',ev=>{ ev.preventDefault(); const name=f.value.trim(); if(!name) return; x.name=name; touch(); close(); keepScroll(render); });\n  });\n}\n/* pick items from the whole library straight into one heading */\nfunction openPicker(bk){\n  const p=bk.split('.'); const s=+p[0];\n  const where=esc(est.sections[s])+' › '+esc(subName(s,p[1]))+' › '+esc(headName(s,p[1],p[2]));\n  const INDEX=[]; for(const c of LIB){ let hdr='', sup='', prevH=null; for(const r of c.rows){ if(r.length<3){ if(prevH!==null) sup=prevH; hdr=r[1]; prevH=r[1]; continue; } prevH=null; if(!r[8]) INDEX.push({c,r,hdr:(sup&&sup!==hdr?sup+' › ':'')+hdr}); } }\n  const sheets='<option value=\"\">All sheets<\/option>'+LIB.map(c=>'<option value=\"'+c.id+'\">'+esc(c.name)+'<\/option>').join('');\n  dialog('<h3>Choose items<\/h3><p class=\"note\">Adding to <b>'+where+'<\/b>. Linked items (glands’ lock nuts, outlets’ wall clips and so on) are added automatically.<\/p>'+\n    '<div class=\"pickbar\"><input id=\"pkQ\" type=\"search\" placeholder=\"Search, e.g. 4c 16mm, gland 32mm, double GPO\" autocomplete=\"off\" aria-label=\"Search items\"><select id=\"pkS\" aria-label=\"Sheet\">'+sheets+'<\/select><\/div>'+\n    '<div id=\"pkList\" class=\"picklist\"><\/div><div class=\"actions\"><button class=\"btn primary\" data-close type=\"button\">Done<\/button><\/div>',close=>{\n    const list=$('#pkList'), qI=$('#pkQ'), sI=$('#pkS');\n    const draw=()=>{\n      const q=qI.value.trim().toLowerCase().split(/\\s+/).filter(Boolean), sh=sI.value;\n      if(!q.length&&!sh){ list.innerHTML='<p class=\"note\">Type to search the library, or pick a sheet to browse it.<\/p>'; return; }\n      const hits=INDEX.filter(x=>(!sh||x.c.id===sh)&&q.every(w=>(eff(x.c,x.r).desc+' '+x.r[1]+' '+x.hdr+' '+x.c.name).toLowerCase().includes(w))).slice(0,80);\n      if(!hits.length){ list.innerHTML='<p class=\"note\">No items match. Try fewer words.<\/p>'; return; }\n      list.innerHTML=hits.map(x=>{ const e=eff(x.c,x.r); const have=qIn(x.c.id,x.r[0],bk); const nk=(groupsFor(x.c).kids[String(x.r[0])]||[]).length;\n        return '<div class=\"pk\"><div class=\"pkd\"><div class=\"pkn\">'+esc(e.desc)+(nk?'<span class=\"tag link\">+'+nk+' linked<\/span>':'')+'<\/div><div class=\"meta\">'+esc(x.c.name)+(x.hdr?' · '+esc(x.hdr):'')+' · '+money(e.p*(1-e.disc))+' · '+fmt(e.rate*e.k,3)+' h'+(have?' · <b class=\"inhere\">'+fmt(have,2)+' here<\/b>':'')+'<\/div><\/div>'+\n          '<input class=\"q\" type=\"number\" min=\"0\" step=\"any\" inputmode=\"decimal\" aria-label=\"Quantity to add\" data-pq=\"'+x.c.id+'|'+x.r[0]+'\" placeholder=\"Qty\">'+\n          '<button type=\"button\" class=\"btn\" data-padd=\"'+x.c.id+'|'+x.r[0]+'\">Add<\/button><\/div>'; }).join('')+(hits.length===80?'<p class=\"note\">Showing the first 80 matches. Add more words to narrow it down.<\/p>':'');\n    };\n    qI.addEventListener('input',draw); sI.addEventListener('change',draw); qI.focus(); draw();\n    const add=key=>{ const inp=list.querySelector('[data-pq=\"'+key+'\"]'); const v=parseFloat(inp&&inp.value); if(!(v>0)){ inp&&inp.focus(); return; }\n      const kp=key.split('|'); setQ(kp[0],+kp[1],bk,qIn(kp[0],+kp[1],bk)+v); render(); toast('Added '+fmt(v,2)+' × '+eff(CAT[kp[0]],CAT[kp[0]].items[+kp[1]]).desc); draw(); };\n    list.addEventListener('click',ev=>{ const b=ev.target.closest('[data-padd]'); if(b) add(b.dataset.padd); });\n    list.addEventListener('keydown',ev=>{ const i=ev.target.closest('[data-pq]'); if(i&&ev.key==='Enter'){ ev.preventDefault(); add(i.dataset.pq); } });\n  });\n}\nfunction openSubs(){\n  const s=ui.sec; const list=subsOf(s);\n  let h='<h3>Sub-sections in '+esc(est.sections[s])+'<\/h3><div class=\"list\">';\n  list.forEach(x=>{ h+='<div class=\"it\"><input id=\"sub-'+x.id+'\" value=\"'+esc(x.name)+'\" aria-label=\"Sub-section name\" style=\"flex:1;min-width:0;padding:5px 7px;border:1px solid var(--line-2);border-radius:4px;background:var(--bg)\">'+(x.id==='g'?'<span class=\"meta\">default<\/span>':'<button class=\"btn ghost\" type=\"button\" data-delsub=\"'+x.id+'\">Remove<\/button>')+'<\/div>'; });\n  h+='<\/div><p class=\"note\" id=\"subWarn\"><\/p><div class=\"actions\"><button class=\"btn primary\" data-close type=\"button\">Done<\/button><\/div>';\n  dialog(h,close=>{\n    list.forEach(x=>{ const inp=$('#sub-'+x.id); inp.addEventListener('input',()=>{ x.name=inp.value||(x.id==='g'?'General':'Sub-section'); touch(); render(); }); });\n    $('#ov').addEventListener('click',ev=>{ const d=ev.target.closest('[data-delsub]'); if(!d) return; const id=d.dataset.delsub; const bk=s+'.'+id;\n      const has=bucketHasQty(k=>k.startsWith(bk+'.'));\n      if(has&&!d.dataset.sure){ d.dataset.sure=1; d.textContent='Remove and clear its quantities'; $('#subWarn').textContent='This sub-section has quantities. Click again to remove it and clear them.'; return; }\n      clearBuckets(k=>k.startsWith(bk+'.')); delete est.heads[bk]; est.subs[s]=list.filter(x=>x.id!==id); if(ui.sub===id){ ui.sub='g'; ui.head='h'; } touch(); render(); close(); openSubs(); toast('Sub-section removed'); });\n  });\n}\nasync function openList(){\n  await flush(); const list=await listEstimates();\n  let h='<h3>Your estimates<\/h3><p class=\"note\">'+(store.mode==='db'?'Saved to your account, private to you.':'Saved in this browser only.')+'<\/p><div class=\"list\">'+\n    list.map(e=>'<div class=\"it\"><div><div style=\"font-weight:600\">'+esc(e.name)+(e.id===est.id?' <span class=\"tag sup\">open<\/span>':'')+'<\/div><div class=\"meta\">Updated '+new Date(e.updated).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'})+'<\/div><\/div><div style=\"display:flex;gap:6px\"><button class=\"btn\" data-open=\"'+e.id+'\" type=\"button\">Open<\/button><button class=\"btn ghost\" data-dup=\"'+e.id+'\" type=\"button\">Duplicate<\/button><button class=\"btn ghost\" data-del=\"'+e.id+'\" type=\"button\">Delete<\/button><\/div><\/div>').join('')+\n    '<\/div><div class=\"actions\"><button class=\"btn\" data-close type=\"button\">Close<\/button><\/div>';\n  dialog(h,close=>{\n    $('#ov').addEventListener('click',async ev=>{\n      const o=ev.target.closest('[data-open]'), d=ev.target.closest('[data-del]'), u=ev.target.closest('[data-dup]');\n      if(o){ const x=list.find(e=>e.id===o.dataset.open); load(unpack(x)); close(); }\n      if(u){ const x=unpack(list.find(e=>e.id===u.dataset.dup)); const n=blankEstimate(x.name+' (copy)'); Object.assign(x,{id:n.id,name:n.name,created:n.created,updated:Date.now(),example:false}); load(x); dirty=true; await flush(); close(); toast('Duplicated'); }\n      if(d){ if(!d.dataset.sure){ d.dataset.sure=1; d.textContent='Confirm delete'; d.classList.remove('ghost'); return; }\n        await deleteEstimate(d.dataset.del).catch(()=>{}); if(d.dataset.del===est.id){ const rest=list.filter(e=>e.id!==d.dataset.del); load(rest.length?unpack(rest[0]):blankEstimate()); }\n        close(); toast('Estimate deleted'); }\n    });\n  });\n}\nfunction load(e){ est=e; est.heads=est.heads||{}; Object.keys(CACHE).forEach(k=>delete CACHE[k]); ui.sec=0; ui.sub='g'; ui.head='h'; dirty=false; $('#saveState').textContent=''; try{localStorage.setItem(LS+'-last',e.id);}catch(x){} render(); }\n$('#btnNew').onclick=async()=>{ await flush(); load(blankEstimate('New estimate')); dirty=true; flush(); ui.view='summary'; render(); $('#estName').select(); };\n$('#btnOpen').onclick=openList;\n\n/* ---------- CSV export ---------- */\nfunction csv(){\n  const q=v=>{ const s=String(v??''); return /[\",\\n]/.test(s)?'\"'+s.replace(/\"/g,'\"\"')+'\"':s; };\n  const secs=est.sections.slice(0,est.nsec);\n  const lines=[['Estimate',est.name],['Labour rate $/hr',est.rate],['Margin %',est.markup],[],\n    ['Sheet','Code','Description',...secs,'Total qty','Unit $','Disc %','Net unit $','Material $','Hrs/unit','Difficulty','Labour hrs','Labour $']];\n  let G=grand();\n  for(const c of LIB){ if(!est.q[c.id]) continue; const res=calc(c.id);\n    for(const r of c.rows){ if(r.length<3) continue; const a=res.rows[r[0]]; if(!a) continue; const e=eff(c,r); const tq=a.reduce((x,y)=>x+y,0); if(!tq) continue;\n      const net=e.p*(1-e.disc), hrs=tq*e.rate*e.k;\n      lines.push([c.name,r[1],e.desc,...a.map(v=>+v.toFixed(3)),+tq.toFixed(3),e.p,+(e.disc*100).toFixed(2),+net.toFixed(4),+(tq*net).toFixed(2),e.rate,e.k,+hrs.toFixed(3),+(hrs*est.rate).toFixed(2)]); } }\n  lines.push([],['Totals'],['Material $',G.mat.toFixed(2)],['Labour hrs',G.hrs.toFixed(2)],['Labour $',lab(G.hrs).toFixed(2)],['Sell price $',sell(G.mat,G.hrs).toFixed(2)]);\n  lines.push([],['Section','Material $','Labour hrs','Sell $'],...secs.map((s,i)=>[s,G.secMat[i].toFixed(2),G.secHrs[i].toFixed(2),sell(G.secMat[i],G.secHrs[i]).toFixed(2)]));\n  lines.push([],['Section summaries'],['Section','Sub-section','Heading','Sheet','Item','Qty','Linked lines','Material $','Labour hrs','Sell $']);\n  for(let s=0;s<est.nsec;s++) for(const x of subsOf(s)){ for(const hd of headsOf(s,x.id)){ const bk=s+'.'+x.id+'.'+hd.id;\n    for(const it of bucketItems(bk)) lines.push([est.sections[s],x.name,hd.name,it.cat.name,it.desc,it.qty===null?'':+it.qty.toFixed(3),it.linked,it.mat.toFixed(2),it.hrs.toFixed(2),sell(it.mat,it.hrs).toFixed(2)]);\n    const tt=bucketTotals(bk); if(tt.mat||tt.hrs) lines.push([est.sections[s],x.name,hd.name+' total','','','','',tt.mat.toFixed(2),tt.hrs.toFixed(2),sell(tt.mat,tt.hrs).toFixed(2)]); }\n    const st=prefixTotals(s+'.'+x.id+'.'); if(st.mat||st.hrs) lines.push([est.sections[s],x.name+' total','','','','','',st.mat.toFixed(2),st.hrs.toFixed(2),sell(st.mat,st.hrs).toFixed(2)]); }\n  return lines.map(l=>l.map(q).join(',')).join('\\n');\n}\nlet dl=null;\n$('#btnExport').onclick=async()=>{\n  const text=csv(); const name=(est.name.replace(/[^\\w\\- ]+/g,'').trim()||'estimate')+'.csv';\n  if(dl){ try{ await dl.save({filename:name,data:text}); toast('CSV saved'); return; }catch(e){ if(e&&e.code==='declined') return; } }\n  try{ await navigator.clipboard.writeText(text); toast('CSV copied to clipboard. Paste it into a spreadsheet.'); }\n  catch(e){ dialog('<h3>Export CSV<\/h3><p class=\"note\">Copy this text and paste it into a spreadsheet.<\/p><textarea style=\"width:100%;height:260px;font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line-2)\" readonly>'+esc(text)+'<\/textarea><div class=\"actions\"><button class=\"btn primary\" data-close type=\"button\">Close<\/button><\/div>',()=>{ const ta=document.querySelector('.dlg textarea'); ta.focus(); ta.select(); }); }\n};\n\n/* sticky offset for the rail */\nfunction setHdr(){ document.documentElement.style.setProperty('--hdr',$('#hdr').offsetHeight+'px'); }\nwindow.addEventListener('resize',setHdr);\n\n/* ---------- boot ---------- */\nasync function boot(){\n  load(exampleEstimate()); setHdr();\n  await initStore();\n  if(window.claude&&window.claude.use){ claude.use('downloads').then(d=>{dl=d;}).catch(()=>{}); }\n  const list=await listEstimates();\n  let last=null; try{ last=localStorage.getItem(LS+'-last'); }catch(x){}\n  if(list.length){ const pick=list.find(e=>e.id===last)||list[0]; load(unpack(pick)); }\n  else { dirty=true; await flush(); }\n  setHdr();\n}\nboot();\nwindow.addEventListener('beforeunload',()=>{ if(dirty) flush(); });\n})();\n<\/script>\n\n<\/body><\/html>";

function dataFor(p){
  const [c,id]=p.split('/');
  if(c==='projects')return PROJ[id];

function persist(p){
  if(!db){setSave('local');return}

async function flush(p){
  delete pending[p];inflight[p]=(inflight[p]||0)+1;flushAt[p]=Date.now();
  try{
    if(p.startsWith('apartments/')){
      const t=p.split('/')[1];const d=aptDoc(t);const Q=aptQueue[t]||new Set();const units={};
      for(const u of Q)units[u]=unitState(t,u);Q.clear();
      const body={name:d.name,created:d.created,removed:d.removed,stages:d.stages,itps:d.itps,units};if(structDirty.has(t)){body.sections=d.sections;structDirty.delete(t)}
      if(exists.has(p))await db.doc(phys(p)).update(body);else{await db.doc(phys(p)).set(clone(d));exists.add(p)}
    }else{
      const data=dataFor(p);if(data)await db.doc(phys(p)).set(clone(data));exists.add(p);
    }
  }catch(e){
    console.error(e);
    if(e&&e.code==='invalid_argument'&&p.startsWith('apartments/')){exists.delete(p)}
    setSave('error',e&&e.code==='quota_exceeded'?'Storage full':e&&e.code==='invalid_argument'?'You can view but not edit':'Save failed — retrying on next edit');
    inflight[p]--;return;
  }
  inflight[p]--;
  if(!isDirty(p)&&latest[p]&&latestAt[p]>flushAt[p]&&!p.startsWith('variations/')&&!p.startsWith('orders/')&&!p.startsWith('procurement/')&&!p.startsWith('msod/')&&!p.startsWith('estimates/'))applyDoc(p,latest[p]);

}

}
function onColl(name,snap){
  const mapKey={variations:'vars',orders:'orders',procurement:'procs',msod:'msods',estimates:'ests'}[name];if(name==='estimates')CALC.loaded=true;
  const seen=new Set();
  const next={};
  for(const d of snap.docs){
    const p=name+'/'+d.id;seen.add(p);exists.add(p);latest[p]=d.data();latestAt[p]=Date.now();
    if(deleted.has(p))continue;
    if(mapKey){next[d.id]=isDirty(p)&&S[mapKey][d.id]?S[mapKey][d.id]:clone(d.data())}
    else if(!isDirty(p))applyDoc(p,d.data());
  }
  for(const p of [...deleted])if(p.startsWith(name+'/')&&!seen.has(p))deleted.delete(p);
  if(mapKey){
    for(const id in S[mapKey]){const p=name+'/'+id;if(!(id in next)&&isDirty(p))next[id]=S[mapKey][id]}
    S[mapKey]=next;
  }
  scheduleRender();
}

}
function logTotals(){let h=0,o=0,pm=0,c=0,hc=0;for(const r of S.llog.rows){h+=num(r.hire);o+=num(r.ox);pm+=num(r.pm);c+=num(r.cost);hc+=num(r.hireCost)}const t=h+o+pm;return {hire:h,ox:o,pm,hrs:t,cost:c,hireCost:hc,total:c+hc,rate:t?(c+hc)/t:0}}
function labourRateSrc(){if(num(S.info.labourRate))return 'Override set in project details';if(logTotals().rate)return 'Average from labour cost log';if(num(S.info.tenderRate))return 'Tendered rate (no labour cost log entries yet)';return 'Blended crew rate (add rows to the labour cost log to use actual costs)'}
function labourRate(){return num(S.info.labourRate)||logTotals().rate||num(S.info.tenderRate)||crewRate()}
function taskCalc(t){

  for(const it of taskDoc(t).items){const x=itemCalc(it);est+=x.est;spent+=x.spent;earned+=x.earned;fc+=x.fc}

}

function itemOne(it){
  const e=num(it.estHrs),s=num(it.spentHrs),p=Math.min(Math.max(num(it.pct),0),100)/100,q=num(it.qty);
  const ftc=p>0?(s>0?s*(1-p)/p:e*(1-p)):e;const ov=it.instOv!==undefined&&it.instOv!==null&&it.instOv!=='';
  const ins=q*p;
  return {est:e,spent:s,qty:q,pct:p,installed:ins,instCalc:q*p,instOv:ov,earned:e*p,ftc,fc:s+ftc,varHrs:e-(s+ftc),rateEst:e/100,rateAct:p?s/(p*100):0};

function instCell(key,o,x){const f=v=>(Math.round(v*10)/10).toLocaleString('en-AU',{maximumFractionDigits:1});
  return `<div class="instov${x.instOv?' on':''}"><div class="pctin">${inp(key,o.instOv??'',{num:1,label:'Installed override (% of task)',ph:f(x.instCalc)})}</div><span class="hint">${x.instOv?`Override · calc ${f(x.instCalc)}%`:'Task % × complete'}</span></div>`}
const subAt=(it,kp)=>String(kp).split('.').reduce((n,i)=>n&&n.subs?n.subs[+i]:null,it);
function nodeAt(d,path){const P=String(path).split('.');const it=d.items[+P[0]];return P.length>1?subAt(it,P.slice(1).join('.')):it}
function itemCalc(it){
  if(!(it.subs&&it.subs.length))return itemOne(it);
  const t={est:0,spent:0,qty:0,installed:0,earned:0,ftc:0,fc:0};
  for(const sb of it.subs){const x=itemCalc(sb);for(const k in t)t[k]+=x[k]}
  t.pct=t.est?t.earned/t.est:0;t.varHrs=t.est-t.fc;t.rateEst=t.est/100;t.rateAct=t.pct?t.spent/(t.pct*100):0;t.split=true;t.instOv=it.subs.some(sb=>sb.instOv!==undefined&&sb.instOv!==null&&sb.instOv!=='');return t;
}
function subRate(d,sb){const sg=d.stages.find(z=>z.id===sb.task);return sb.rate!==''&&sb.rate!=null?num(sb.rate):(sg?num(sg.rate):0)}
function subCalc(d,sb){const v=subRate(d,sb)*lineQty(sb);const p=Math.min(Math.max(num(sb.pct),0),100)/100;return {v,p,c:v*p}}
function aptCalc(t){
  const d=aptDoc(t);const rates=d.stages.map(s=>num(s.rate));const per=rates.reduce((a,x)=>a+x,0);const n=d.stages.length;
  const share=i=>per?rates[i]/per:(n?1/n:0);
  const stage=d.stages.map((s,i)=>({id:s.id,name:s.name,price:rates[i],total:0,claimed:0,done:0}));
  const itp={};d.itps.forEach(x=>itp[x.id]=0);let claimed=0,full=0,total=0,count=0;const secs={};
  for(const sec of d.sections){const sc=secs[sec.id]={total:0,claimed:0,count:sec.lines.length};
    for(const l of sec.lines){count++;const st=d.units[l.id]||{};let uc=0,v=0,all;
      if(l.subs&&l.subs.length){all=true;for(const sb of l.subs){const x=subCalc(d,sb);v+=x.v;uc+=x.c;const sg=stage.find(z=>z.id===sb.task);if(sg){sg.total+=x.v;sg.claimed+=x.c;if(x.p>=1)sg.done++}if(x.p<1)all=false}total+=v;sc.total+=v}
      else{v=(num(l.rate)||per)*lineQty(l);total+=v;sc.total+=v;all=n>0;
      stage.forEach((s,i)=>{const p=num(st.s?.[s.id]);const sv=v*share(i);s.total+=sv;s.claimed+=sv*p/100;uc+=sv*p/100;if(p>=100)s.done++;else all=false})}
      claimed+=uc;sc.claimed+=uc;if(all)full++;for(const k in itp)if(st.itp?.[k])itp[k]++}}
  return {id:t,name:d.name,count,per,total,claimed,stage,itp,full,secs,pct:total?claimed/total:0};
}
function calc(){
  const contract=(S.info.contract!==undefined&&S.info.contract!=='')?num(S.info.contract):claimTotals().c.sum,pcSum=num(S.info.pcSum);
  let vApp=0,vUn=0,vRej=0,vProfit=0;const vCount={};
  for(const v of Object.values(S.vars)){
    const VN=vNums(v);const sub=VN.sell;const st=v.status||'Submitted';vCount[st]=(vCount[st]||0)+1;
    if(st==='Approved'){vApp+=sub;vProfit+=VN.margin}
    else if(st==='Rejected'||st==='Withdrawn')vRej+=sub;else vUn+=sub;
  }
  const revised=contract+vApp;
  let poTotal=0,matInv=0,matAnt=0,matFc=0,ret=0,leftPO=0;
  for(const o of Object.values(S.orders)){
    const po=num(o.po),inv=(o.inv||[]).reduce((a,x)=>a+invAmt(x),0),ant=extraAdj(o);
    poTotal+=po;leftPO+=Math.max(po-inv,0);matInv+=inv;matAnt+=ant;matFc+=Math.max(po,inv)+ant;if(o.retention)ret+=inv*0.05;
  }
  const rate=labourRate();
  let lEst=0,lSpent=0,lFc=0,lEarned=0;
  for(const t of TASK_IDS){const c=taskCalc(t);lEst+=c.est;lSpent+=c.spent;lFc+=c.fc;lEarned+=c.earned}
  const otherHrs=num(S.info.otherHrs);lSpent+=otherHrs;lFc+=otherHrs;
  const labAct=lSpent*rate,labFc=lFc*rate;
  const other=num(S.info.otherCost);
  const fcCost=matFc+labFc+other;
  const CT=claimTotals();const LT=(S.llog&&S.llog.rows)?logTotals():{total:0};const labLog=LT.total;const labCostToDate=labLog||labAct;const otherToDate=num(S.info.otherCostToDate);const costToDate=labCostToDate+matInv+otherToDate;
  const invoiced=CT.ha,retention=CT.ret;
  const gp=revised-fcCost;const TR=tradeIds().map(aptCalc);const subTotal=TR.reduce((a,x)=>a+x.total,0),subClaimed=TR.reduce((a,x)=>a+x.claimed,0);
  return {contract,pcSum,vApp,vUn,vRej,vProfit,vCount,revised,poTotal,matInv,matAnt,matFc,ret,rate,lEst,lSpent,lFc,lEarned,labAct,labFc,other,fcCost,costToDate,labLog,labCostToDate,otherToDate,
    invoiced,retention,gp,gpPct:revised?gp/revised:0,leftInvoice:revised-invoiced,leftSpend:Math.max(lFc-lSpent,0)*rate+leftPO+matAnt,labHrsToGo:Math.max(lFc-lSpent,0),leftPO,marginToDate:invoiced-costToDate,pctInv:revised?invoiced/revised:0,
    trades:TR,subTotal,subClaimed,pctCost:fcCost?costToDate/fcCost:0,pctHrs:lEst?lEarned/lEst:0,pctSub:subTotal?subClaimed/subTotal:0};
}
function months(){
  let st=S.cash.start;if(!/^\d{4}-\d{2}$/.test(st||'')){const d=new Date();st=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  let [y,m]=st.split('-').map(Number);const out=[];
  for(let i=0;i<30;i++){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}

function cashChart(){
  const ms=months();let cs=0,cc=0;const pts=ms.map(k=>{const r=S.cash.m[k]||{};cs+=num(r.sales);cc+=num(r.cost);return {k,cs,cc}});
  const max=Math.max(1,...pts.map(p=>Math.max(p.cs,p.cc)));
  if(!pts.some(p=>p.cs||p.cc))return `<div class="empty"><b>No forecast entered yet</b>Add monthly claim and cost forecasts under Cash flow to see cumulative sales against cost.</div>`;
  const W=900,H=260,L=64,R=14,T=12,B=30,iw=W-L-R,ih=H-T-B;
  const nice=(()=>{const step=Math.pow(10,Math.floor(Math.log10(max)));const m=[1,2,2.5,5,10].find(x=>x*step*4>=max)*step;return m})();
  const top=nice*4;const x=i=>L+iw*i/(pts.length-1),y=v=>T+ih*(1-v/top);
  let grid='';for(let i=0;i<=4;i++){const v=nice*i;grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${kmoney(v)}</text>`}
  let xl='';pts.forEach((p,i)=>{if(i%3===0)xl+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${monthLabel(p.k)}</text>`});

}

}

async function uploadItp(key,file){
  if(!assets)return;
  if(!(file.type==='application/pdf'||/\.pdf$/i.test(file.name))){setSave('error','File must be a PDF');return}
  if(file.size>20*1024*1024){setSave('error','File is over 20 MB');return}
  UP[key]=true;render();
  try{const old=getItp(key);const r=await assets.upload(file,{type:'application/pdf'});setItp(key,{id:r.id,name:file.name});
    if(old&&old.id)assets.delete(old.id).catch(()=>{});
    const kp=key.split('|');if(kp[0]==='inv')setTimeout(()=>extractInvoice(kp[1],+kp[2],file,false),0)}
  catch(e){console.error(e);setSave('error',e&&e.code==='too_large'?'ITP is over 20 MB':e&&e.code==='quota_or_state'?'File storage is full':'ITP upload failed')}
  delete UP[key];render();
}

      Object.assign(base,{ref:v.ref||base.ref||'',desc:v.desc||base.desc||'',sum:String(Math.round(vNums(v).sell*100)/100)});
      if(st==='Approved'){base.aref=v.approvalRef||base.aref||'';d.av.push(base)}
      else{base.status=base.status&&base.status!=='Draft'?base.status:'Submitted';base.sub=base.sub||v.date||'';d.pv.push(base)}
      changed=true;
    }else if(st==='Draft'&&old){d.pv.push(old)}
  }
  if(changed)persist('project/claim');
}
function vNums(v){if(hasBu(v)){const x=vbuCalc(v.bu);return {sell:x.sell.total,cost:x.cost.total,mat:x.matCost,lab:x.labCost,hrs:x.hrs,margin:x.margin,bu:true}}
  const sell=num(v.submitted),mat=num(v.nonLabour),lab=num(v.labour);return {sell,cost:mat+lab,mat,lab,hrs:num(v.hours),margin:sell-mat-lab,bu:false}}
const GST=0.1;
function extraAdj(o){const po=num(o.po),inv=(o.inv||[]).reduce((a,x)=>a+invAmt(x),0),ant=num(o.anticipated);const left=po-inv;return left<0?Math.max(ant+left,0):ant}
const money2=n=>(n<0?'−$':'$')+Math.abs(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const invLines=x=>Array.isArray(x.lines)?x.lines:[];
const lineEx=l=>num(l.qty===''||l.qty==null?1:l.qty)*num(l.rate);
const linesSum=x=>invLines(x).reduce((a,l)=>a+lineEx(l),0);
const invAmt=x=>(x.amount!==''&&x.amount!=null)?num(x.amount):linesSum(x);

/* ---------- progress claim ---------- */
const newPcLine=()=>({id:uid('c'),item:'',desc:'',sum:'',pct:'',prev:'',apct:''});
function normClaim(d){d=d||{};return {hdr:d.hdr||{},secs:Array.isArray(d.secs)&&d.secs.length?d.secs:[{id:'C1',name:'Contract works',lines:[{id:'c1',item:'1',desc:'',sum:'',pct:'',prev:'',apct:''}]}],
  av:Array.isArray(d.av)?d.av:[],pv:Array.isArray(d.pv)?d.pv:[],hist:Array.isArray(d.hist)?d.hist:[],retMax:d.retMax??'5'}}
const claimDoc=()=>S.claim||(S.claim=normClaim(null));
function pcLine(l){const sum=num(l.sum),claimed=sum*num(l.pct)/100,prev=num(l.prev);const ap=(l.apct===''||l.apct==null)?num(l.pct):num(l.apct);const assessed=sum*ap/100;
  return {sum,claimed,prev,this:claimed-prev,ap,assessed,pay:assessed-prev,diff:(assessed-prev)-(claimed-prev)}}
function pcSum(lines){const t={sum:0,claimed:0,prev:0,this:0,assessed:0,pay:0,diff:0};for(const l of lines){const x=pcLine(l);for(const k in t)t[k]+=x[k]}return t}
function claimTotals(){
  const d=claimDoc();const c=pcSum(d.secs.flatMap(x=>x.lines)),a=pcSum(d.av),p=pcSum(d.pv);const all={};for(const k in c)all[k]=c[k]+a[k]+p[k];
  let hs=0,ha=0,hr=0,hp=0,hc=0;for(const h of d.hist){const ap=num(h.approved);hs+=num(h.submitted);ha+=ap;const r=ap*num(h.ret)/100;hr+=r;hp+=ap-r;hc+=num(h.cost)}
  return {c,a,p,all,hs,ha,ret:hr,paid:hp,cost:hc}}
const r2s=v=>(v===''||v==null)?'':String(Math.round(num(v)*100)/100);
function pcBar(c,a){c=Math.min(Math.max(c,0),1);a=Math.min(Math.max(a,0),1);
  return `<div class="pcbar" title="${pct(c,0)} claimed · ${pct(a,0)} approved"><div class="bar"><i style="width:${(c*100).toFixed(1)}%"></i></div><div class="bar b2 thin"><i style="width:${(a*100).toFixed(1)}%"></i></div></div><div class="pcbar-l"><span>${pct(c,0)}</span><span class="hint">${pct(a,0)} appr.</span></div>`}
function pcRows(area,lines,si,opt={}){

    ${opt.var?`<td style="min-width:100px">${inp(k+'ref',l.ref,{label:'Ref',ph:area==='a'?'VQ-':'SCVO'})}</td>`:`<td style="width:70px">${inp(k+'item',l.item,{label:'Item'})}</td>`}

    ${area==='a'?`<td style="min-width:120px">${inp(k+'aref',l.aref,{label:'Approval ref'})}</td>`:''}
    ${area==='p'?`<td style="width:120px">${sel(k+'status',l.status||'Submitted',['Draft','Submitted','Under review','Directed'],{label:'Status'})}</td><td style="width:140px">${inp(k+'sub',l.sub,{type:'date',label:'Submitted'})}</td>`:''}
    <td style="min-width:140px"><div class="cur">${inp(k+'sum',l.sum,{num:1,label:'Amount'})}</div></td>

    <td style="min-width:130px"><div class="cur">${inp(k+'prev',l.prev,{num:1,label:'Previously approved',ph:'0'})}</div>${sum&&num(l.prev)?`<div class="hint" style="text-align:right;font-size:11.5px;margin-top:2px">${pct(num(l.prev)/sum,1)} approved before</div>`:''}</td>
    <td style="min-width:150px">${pcBar(sum?x.claimed/sum:0,sum?x.assessed/sum:0)}</td>
    <td style="min-width:130px"><div class="cur">${inp(k+'amtC',r2s(x.claimed),{num:1,label:'Claimed to date'})}</div></td>
    <td class="n">${sum?pct(x.this/sum,1):'—'}</td>
    <td style="min-width:130px"><div class="cur">${inp(k+'thisC',r2s(x.this),{num:1,label:'This claim'})}</div></td>
    <td style="min-width:80px">${inp(k+'apct',r2s(l.apct),{num:1,label:'% approved',ph:r2s(num(l.pct))})}</td>
    <td style="min-width:130px"><div class="cur strong">${inp(k+'amtA',r2s(x.assessed),{num:1,label:'Amount approved'})}</div></td><td style="min-width:130px"><div class="cur">${inp(k+'payA',r2s(x.pay),{num:1,label:'Approved this claim'})}</div></td><td class="n money ${x.diff<0?'neg':''}">${money(x.diff)}</td></tr>`}).join('');

/* ---------- MSOD (material schedule of delivery) ---------- */
const MS_COLS={
  general:[['type','Type',120],['desc','Description',240],['details','Details',160],['cat','Cat number',120]],
  submain:[['from','From',110],['to','To',110],['cable','Cable ID',100],['n','No. of cables',80,1],['config','Config',90],['size','Cable size',90],['cond','Conductor type',100],['ins','Insulation',90],['run','Run length (m)',90,1]]
};
const MS_LABEL={general:'General materials',submain:'Submains'};
const MS_APPR=[['pm','Project Manager / Supervisor'],['hse','HSE Manager'],['est','Estimating Manager'],['ops','Operations Manager'],['div','Division Manager'],['gm','General Manager']];
const msItem=()=>({id:uid('i'),q:{},r:[]});
function msNew(type){
  const n=6;
  return {created:Date.now(),type,name:'',title:'',suppliers:Array(n).fill(''),
    locs:[1,2,3].map(i=>({id:uid('L'),name:'PS'+i})),items:Array.from({length:5},msItem),
    hdr:{jobName:PROJ[PID]?.name||S.info.name||'',jobNo:S.info.job||''},appr:{},dockets:[],budget:'',chosen:''};
}
const msIds=()=>Object.keys(S.msods).sort((a,b)=>(S.msods[a].created||0)-(S.msods[b].created||0));
const msName=m=>{if(m.name)return m.name;const same=msIds().map(x=>S.msods[x]).filter(x=>x.type===m.type);const k=same.indexOf(m);return (MS_LABEL[m.type]||'MSOD')+' MSOD'+(k>=0?' '+(k+1):'')};
function msDesc(m,it){
  if(m.type==='submain'){const a=[it.cable,[it.from,it.to].filter(Boolean).join(' → '),[it.n?it.n+' ×':'',it.size,it.config,it.cond,it.ins].filter(Boolean).join(' ')].filter(Boolean);return a.join(' · ')}
  return [it.type,it.desc,it.details].filter(Boolean).join(' – ');
}
const msCat=(m,it)=>m.type==='submain'?(it.cable||''):(it.cat||'');
function msQty(m,it){
  const has=m.locs.some(l=>it.q&&it.q[l.id]!==undefined&&it.q[l.id]!=='');
  if(has)return {qty:m.locs.reduce((a,l)=>a+num(it.q[l.id]),0),src:'takeoff'};
  if(m.type==='submain'&&it.n!==undefined&&it.n!==''&&it.run!==undefined&&it.run!=='')return {qty:num(it.n)*num(it.run),src:'cable'};
  return {qty:num(it.qty),src:'manual'};
}
function msLow(m,it){let lo=0;for(let i=0;i<m.suppliers.length;i++){const r=num((it.r||[])[i]);if(r>0&&(!lo||r<lo))lo=r}return lo}
const msChosen=m=>{const c=m.chosen;return c!==undefined&&c!==null&&c!==''&&+c<m.suppliers.length?+c:-1};
const msSupName=(m,i)=>i<0?'':(m.suppliers[i]||'Supplier '+(i+1));
function msCalc(m){
  const ns=m.suppliers.length;const sup=Array(ns).fill(0);const ch=msChosen(m);let sel=0,dval=0,qty=0,dq=0;
  const rows=m.items.map(it=>{const {qty:q,src}=msQty(m,it);const lo=msLow(m,it);const rate=ch<0?lo:num((it.r||[])[ch]);
    for(let i=0;i<ns;i++)sup[i]+=q*num((it.r||[])[i]);
    let del=0;for(const d of m.dockets)del+=num(d.q?.[it.id]);
    const x={it,q,src,lo,rate,total:q*rate,del,bal:q-del};
    sel+=x.total;dval+=del*rate;qty+=q;dq+=Math.min(del,q);return x});
  const bud=num(m.budget);const proposed=ch<0?0:sel;
  return {rows,sup,ch,sel,bud,proposed,gain:bud-proposed,gp:bud?(bud-proposed)/bud:0,dval,pctDel:sel?dval/sel:(qty?dq/qty:0)};
}
function msNotes(d){if(!Array.isArray(d.notesList)){d.notesList=d.notes?[{id:uid('n'),date:d.date||'',text:d.notes}]:[]}return d.notesList}
