async function poBuild(XL,tpl,d){
  const wb=new XL.Workbook();await wb.xlsx.load(tpl);const ws=wb.worksheets[0];
  const FIRST=16,LAST=50,CAP=LAST-FIRST+1;const n=Math.max(d.lines.length,1);const extra=Math.max(0,n-CAP);
  if(extra){

    for(const g of ranges)if(g.b>=FIRST)ws.unMergeCells(g.t,g.l,g.b,g.r);
    ws.duplicateRow(LAST,extra,true);
    for(const g of ranges){if(g.b<FIRST){continue}
      const t=g.t>LAST?g.t+extra:g.t,b=g.b>=LAST?g.b+extra:g.b;
      if(g.t>=FIRST&&g.b<=LAST&&g.t===g.b&&g.t===LAST){ws.mergeCells(t,g.l,b-extra,g.r);for(let k=1;k<=extra;k++)ws.mergeCells(LAST+k,g.l,LAST+k,g.r);continue}
      ws.mergeCells(t,g.l,b,g.r)}

  }

  set('J12',d.supplier||'');set('N12',d.date?new Date(d.date+'T00:00:00'):'');if(d.date)ws.getCell('N12').numFmt='dd/mm/yyyy';
  set('F12',d.sub?'X':'');set('H12',d.sub?'':'X');

  for(let i=0;i<CAP+extra;i++){const r=FIRST+i;const L=d.lines[i];
    set('C'+r,L?L.desc:null);ws.getCell('C'+r).alignment={horizontal:'left',vertical:'middle',indent:1,wrapText:true};set('K'+r,L?L.qty:null);set('M'+r,L?L.rate:0);
    ws.getCell('O'+r).value={formula:'M'+r+'*K'+r,result:L?Math.round(L.qty*L.rate*100)/100:0}}
  const tot=d.lines.reduce((a,L)=>a+L.qty*L.rate,0)+d.freight;
  const fr=end+1;set('O'+fr,d.freight||0);

/* ---------- import labour cost log rows from Excel / CSV ---------- */
function llogIso(v){if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const t=String(v??'').trim();let m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0')}
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');const d=new Date(t);return t&&!isNaN(d)?llogIso(d):''}
function llogCell(v){if(v&&typeof v==='object'){if(v instanceof Date)return v;if('result' in v)return v.result;if(v.richText)return v.richText.map(x=>x.text).join('');if('text' in v)return v.text}return v}
function llogMap(rows){
  const kind=h=>{h=String(h??'').toLowerCase().replace(/\s+/g,' ').trim();if(!h)return null;
    if(/date|week|period/.test(h))return 'date';
    if(/hire/.test(h)&&/cost|\$|amount|value|spend/.test(h))return 'hireCost';
    if(/hire/.test(h)&&!/rate/.test(h))return 'hire';
    if(/project\s*manag|\bpm\b/.test(h)&&!/cost|\$|amount|rate/.test(h))return 'pm';
    if(/total/.test(h)&&/hour|hrs/.test(h))return 'totHrs';
    if(/oxford|own|direct|staff|sub/.test(h)&&!/cost|\$|amount|rate|wage/.test(h))return 'ox';
    if(/rate/.test(h))return 'rate';
    if(/cost|\$|amount|wage/.test(h)&&!/hire/.test(h))return 'cost';return null};
  let hi=-1,map=null;for(let i=0;i<Math.min(rows.length,15);i++){const m={};rows[i].forEach((c,j)=>{const k=kind(c);if(k&&!(k in m))m[k]=j});const n=['date','hire','ox','pm','cost','hireCost'].filter(k=>k in m).length;if(n>=2){hi=i;map=m;break}}
  let guessed=false;if(!map){map={date:0,hire:1,ox:2,cost:3,hireCost:4};hi=-1;guessed=true}
  const out=[];for(const r of rows.slice(hi+1)){const g=k=>map[k]!==undefined?r[map[k]]:undefined;const first=String(r.find(x=>x!==null&&x!==undefined&&x!=='')??'').toLowerCase();if(/^total/.test(first))continue;
    const nv=k=>{const v=g(k);if(v===undefined||v===null||v==='')return '';const n=num(v);return isFinite(n)&&String(v).trim()!==''?String(Math.round(n*100)/100):''};
    const row={date:llogIso(g('date')),hire:nv('hire'),ox:nv('ox'),pm:nv('pm'),cost:nv('cost'),hireCost:nv('hireCost')};
    if(!row.ox&&map.ox===undefined&&map.totHrs!==undefined&&row.hire!==''){const t=num(g('totHrs'));if(t)row.ox=String(Math.round((t-num(row.hire)-num(row.pm))*100)/100)}
    if(row.hire||row.ox||row.pm||row.cost||row.hireCost)out.push(row)}
  return {rows:out,guessed,found:Object.keys(map).filter(k=>['date','hire','ox','pm','cost','hireCost'].includes(k))}}
async function llogImport(file){
  if(!file)return;const name=file.name||'file';UI.llogMsg={txt:'Reading '+name+'…'};render();
  try{let rows=[];
    if(/\.pdf$/i.test(name)||file.type==='application/pdf'){
      if(!sampleFn){UI.llogMsg={err:1,txt:HOSTED?'Reading PDFs isn’t set up in this version yet. Use Excel or CSV.':'Reading PDFs isn’t available in this view. Use Excel or CSV.'};render();return}
      UI.llogMsg={txt:'Reading '+name+' (PDF)…'};render();const {text,images}=await readPdf(file);
      const prompt=`You are reading a labour cost report or timesheet summary for an Australian electrical contractor. Extract one row per date or week.
Reply with only JSON in exactly this shape: {"rows":[{"date":"YYYY-MM-DD or empty","hire":number,"ox":number,"pm":number,"cost":number,"hireCost":number}]}
"hire" = labour hire HOURS, "ox" = Oxford + subcontractor HOURS, "pm" = project management HOURS, "cost" = Oxford + subcontractor COST in dollars, "hireCost" = labour hire COST in dollars. Use 0 when a value isn't shown. Skip total and subtotal rows. Numbers only, no $ or commas. Dates are Australian (day/month/year).
${images.length?'The document is attached as page images.':'Document text (columns separated by spaces):\n'+text}`;
      const out=await sampleFn.json(prompt,images.length?{images,modelTier:'default'}:{modelTier:'default'});
      const rr=(Array.isArray(out&&out.rows)?out.rows:[]).map(r=>({date:llogIso(r.date),hire:num(r.hire)?String(num(r.hire)):'',ox:num(r.ox)?String(num(r.ox)):'',pm:num(r.pm)?String(num(r.pm)):'',cost:num(r.cost)?String(num(r.cost)):'',hireCost:num(r.hireCost)?String(num(r.hireCost)):''})).filter(r=>r.hire||r.ox||r.pm||r.cost||r.hireCost);
      if(!rr.length){UI.llogMsg={err:1,txt:'No rows with hours or costs were found in '+name+'.'};render();return}
      undoRecord();S.llog.rows.push(...rr);persist('project/labourlog');UI.llogMsg={txt:`Added ${rr.length} row${rr.length===1?'':'s'} from ${name}, read from the PDF. Check the figures — use Undo at the top if they aren’t right.`};render();return}
    if(/\.csv$/i.test(name)||file.type==='text/csv'){const txt=await file.text();rows=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===','){out.push(cur);cur=''}else cur+=c}out.push(cur);return out})}
    else{if(!window.ExcelJS)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');const wb=new window.ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
      const ws=wb.worksheets.find(w=>w.actualRowCount>0)||wb.worksheets[0];ws.eachRow({includeEmpty:false},r=>{const a=[];r.eachCell({includeEmpty:true},(c,ci)=>{a[ci-1]=llogCell(c.value)});rows.push(a)})}
    const R=llogMap(rows);
    if(!R.rows.length){UI.llogMsg={err:1,txt:'No rows with hours or costs were found in '+name+'.'};render();return}
    undoRecord();S.llog.rows.push(...R.rows);persist('project/labourlog');
    UI.llogMsg={txt:`Added ${R.rows.length} row${R.rows.length===1?'':'s'} from ${name}.`+(R.guessed?' No column headings matched, so columns were read in order: date, labour hire, Oxford + subcontractor, Oxford + subcontractor cost, labour hire cost.':' Matched: '+R.found.map(k=>({date:'date',hire:'labour hire',ox:'Oxford + subcontractor',pm:'project management',cost:'Oxford + subcontractor cost',hireCost:'labour hire cost'})[k]).join(', ')+'.')+' Use Undo at the top if it isn’t right.'};render()}
  catch(e){console.error(e);UI.llogMsg={err:1,txt:'Could not read '+name+'. Try an .xlsx, .csv or PDF file.'};render()}}

  if(kind==='vq'){const x=S.vars[a];if(!x)return;x.bu=x.bu||VBU_DEF();x.bu.quoteFile=v;persist('variations/'+a);return}

    else if(kind==='mssup')m.suppliers[+b]=v;else if(kind==='msloc'){if(m.locs[+b])m.locs[+b].name=v}

async function uploadMarkups(id,files){
  const v=S.vars[id];if(!v||!assets)return;v.bu=v.bu||VBU_DEF();UP['vmk'+id]=true;render();
  for(const f of files){const type=/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)?'application/pdf':/png$/i.test(f.type)||/\.png$/i.test(f.name)?'image/png':/jpe?g$/i.test(f.type)||/\.jpe?g$/i.test(f.name)?'image/jpeg':'';
    if(!type){setSave('error',f.name+' isn’t a PDF, PNG or JPG');continue}if(f.size>20*1024*1024){setSave('error',f.name+' is over 20 MB');continue}
    try{const r=await assets.upload(f,{type});(v.bu.markups=v.bu.markups||[]).push({id:r.id,name:f.name,type})}catch(e){console.error(e);setSave('error','Couldn’t upload '+f.name)}}

/* ---------- undo / redo ---------- */
const UNDO={stack:[],redo:[],burstKey:null,burstAt:0};
function undoSnap(){const o={};const add=(p,d)=>{if(d!==undefined&&d!==null)o[p]=JSON.stringify(d)};
  add('project/info',S.info);add('project/cashflow',S.cash);add('project/crew',S.crew);add('project/labourlog',S.llog);add('project/claim',S.claim);
  for(const [c,m] of [['variations',S.vars],['orders',S.orders],['procurement',S.procs],['msod',S.msods],['tasks',S.tasks],['apartments',S.apt]])for(const k in m)add(c+'/'+k,m[k]);
  return o}
const snapKey=o=>Object.keys(o).sort().map(k=>k+'='+o[k]).join('\n');
function undoRecord(){const snap=undoSnap();const key=snapKey(snap);const top=UNDO.stack[UNDO.stack.length-1];if(top&&top.key===key)return null;
  const e={snap,key,redoBak:UNDO.redo};UNDO.stack.push(e);if(UNDO.stack.length>60)UNDO.stack.shift();UNDO.redo=[];undoButtons();return e}
function undoDrop(e){if(!e)return;const i=UNDO.stack.indexOf(e);if(i<0)return;const cur=snapKey(undoSnap());if(cur===e.key){UNDO.stack.splice(i,1);if(!UNDO.redo.length)UNDO.redo=e.redoBak||[];undoButtons()}}
function undoRestore(snap){
  const cur=undoSnap();const paths=new Set([...Object.keys(cur),...Object.keys(snap)]);
  const MAP={variations:'vars',orders:'orders',procurement:'procs',msod:'msods',tasks:'tasks',apartments:'apt'};
  for(const p of paths){if(cur[p]===snap[p])continue;const [c,id]=p.split('/');
    if(snap[p]===undefined){if(MAP[c]){delete S[MAP[c]][id];removeDoc(p)}else if(p==='project/claim'){S.claim=null}continue}
    const d=JSON.parse(snap[p]);deleted.delete(p);
    if(c==='project'){if(id==='info')S.info=d;else if(id==='cashflow')S.cash=d;else if(id==='crew')S.crew=d;else if(id==='labourlog')S.llog=d;else if(id==='claim')S.claim=d}
    else if(c==='apartments'){S.apt[id]=normTrade(id,d);structDirty.add(id);exists.delete(p)}
    else S[MAP[c]][id]=d;
    persist(p)}
}
function doUndo(){const e=UNDO.stack.pop();if(!e)return;const now=undoSnap();UNDO.redo.push({snap:now,key:snapKey(now)});undoRestore(e.snap);UNDO.burstKey=null;UI.armed=null;undoButtons();render()}

function jsonMerge(a,b){if(!a||typeof a!=='object'||Array.isArray(a))a={};const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v))?jsonMerge(a[k],v):v}return o}
function makeSbDb(sb){
  const parent=p=>p.split('/').slice(0,-1).join('/');const T='docs';
  const listeners={};
  async function fetchColl(c){const {data,error}=await sb.from(T).select('path,data').eq('coll',c);if(error)throw error;return data}
  async function emit(c){const L=listeners[c];if(!L||!L.size)return;try{const rows=await fetchColl(c);const snap={docs:rows.map(r=>({id:r.path.split('/').pop(),exists:true,data:()=>r.data})),metadata:{fromCache:false,hasPendingWrites:false}};snap.size=snap.docs.length;snap.empty=!snap.size;for(const f of L)f.next(snap)}catch(e){for(const f of L)f.err&&f.err(e)}}
  const timers={};const bump=c=>{clearTimeout(timers[c]);timers[c]=setTimeout(()=>emit(c),120)};
  sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path);if(p)bump(parent(p))}).subscribe();
  setInterval(()=>{for(const c in listeners)if(listeners[c].size)emit(c)},60000);
  return {
    doc(p){return {
      async set(data){const {error}=await sb.from(T).upsert({path:p,coll:parent(p),data,updated_at:new Date().toISOString()});if(error)throw Object.assign(error,{code:'unavailable'})},
      async update(patch){const {data:row,error:e1}=await sb.from(T).select('data').eq('path',p).maybeSingle();if(e1)throw e1;if(!row)throw {code:'invalid_argument',message:'missing'};
        const {error}=await sb.from(T).update({data:jsonMerge(row.data,patch),updated_at:new Date().toISOString()}).eq('path',p);if(error)throw error},
      async delete(){const {error}=await sb.from(T).delete().eq('path',p);if(error)throw error},
      async get(){const {data}=await sb.from(T).select('data').eq('path',p).maybeSingle();return {id:p.split('/').pop(),exists:!!data,data:()=>data&&data.data}}
    }},
    collection(c){return {onSnapshot(next,err){const f={next,err};(listeners[c]=listeners[c]||new Set()).add(f);emit(c);return ()=>listeners[c].delete(f)}}}
  };
}
function makeSbAssets(sb){return {
  async upload(file,opts){const id=(crypto.randomUUID?crypto.randomUUID():uid('f'))+'.pdf';const {error}=await sb.storage.from('files').upload(id,file,{contentType:(opts&&opts.type)||file.type||'application/pdf',upsert:false});if(error)throw Object.assign(error,{code:'upstream_error'});return {id,url:'#'}},
  async delete(id){await sb.storage.from('files').remove([id]);return {deleted:true}}
}}

async function hostedBoot(startStore,offline){
  const C=window.OX_CONFIG||{};
  if(!window.supabase||!C.supabaseUrl||!C.supabaseAnonKey||/YOUR_/.test(C.supabaseUrl+C.supabaseAnonKey)){document.getElementById('banner').innerHTML='<div class="banner">This copy of the app is not connected to a database yet. '+(window.oxDesktop?'Open <b>Connection settings</b> from the app menu and enter your Supabase details.':'Add your Supabase URL and key to config.js (see the setup guide).')+'</div>';setSave('local');return}
  const sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,detectSessionInUrl:true}});window.__sb=sb;
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginScreen(sb);sb.auth.onAuthStateChange((ev,s2)=>{if(s2&&ev==='SIGNED_IN')location.reload()});setSave('local');document.getElementById('savepill').textContent='Signed out';return}
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload()});
  const myEmail=(session.user.email||'').toLowerCase();
  const {data:meRow,error:meErr}=await sb.from('team').select('*').eq('email',myEmail).maybeSingle();
  if(meErr){document.getElementById('banner').innerHTML='<div class="banner">Could not check your access: '+esc(meErr.message)+'. Has supabase-setup.sql been run?</div>';setSave('error','No connection');return}
  if(!meRow){noAccess(sb,myEmail);setSave('local');document.getElementById('savepill').textContent='No access';return}
  window.__me=meRow;
  document.getElementById('whoami').innerHTML=`<div class="who">${esc(session.user.email||'')}<button class="addproj" id="signout" type="button">Sign out</button>${window.oxDesktop?'<button class="addproj" id="oxsettings" type="button">Connection settings</button>':''}</div>`;
  document.getElementById('signout').onclick=()=>sb.auth.signOut();if(window.oxDesktop)document.getElementById('oxsettings').onclick=()=>window.oxDesktop.openSettings();
  assets=makeSbAssets(sb);downloads=browserDownloads;
  startStore(makeSbDb(sb));render();
}

(function(){
  let h=(location.hash||'').slice(1);if(h==='apartments')h='subcontractors';if(VIEWS_LIST.some(v=>v[0]===h))UI.view=h;
  render();setSave('saving');document.getElementById('savepill').textContent='Connecting';
  const timeout=setTimeout(()=>{if(!db)offline()},12000);
  function offline(){
    setSave('local');
    document.getElementById('banner').innerHTML='<div class="banner">This view can’t reach the shared project store, so edits stay in this browser tab only and are lost on reload. Open the page from claude.ai while signed in to save and share changes.</div>';
  }

  if(!window.claude||!window.claude.use){clearTimeout(timeout);offline();return}
  window.claude.use('db').then(d=>{
    clearTimeout(timeout);
    if(!d){offline();return}

    window.claude.use('downloads').then(x=>{downloads=x}).catch(()=>{});

    startStore(d);
  }).catch(()=>{clearTimeout(timeout);offline()});
  function startStore(d){

      scheduleRender()},e=>console.error(e));
    subscribe();
  }
})();
